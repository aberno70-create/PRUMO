function AbaConfig({ dados, alterar, statusCarga, statusSalvar, erroCarga, recarregar, salvarAgora }) {
  const [appKey, setAppKey] = useState(() => dropboxAppKeyAtual());
  const [apiKey, setApiKey] = useState(dados.config.apiKey || "");
  const [mostrarChave, setMostrarChave] = useState(false);
  const [msg, setMsg] = useState("");
  const conectado = dropboxEstaConectado();
  const redirect = typeof window !== "undefined" ? dropboxRedirectUri() : "";
  /* Cada conta E cada cartao tem pasta propria: as faturas sao
     varias e chegam separadas. */
  const codigos = (dados.contas || []).concat(dados.cartoes || []).map(c => c.codigo).filter(Boolean);

  const novaConta  = () => ({ id: uid(), nome: "", banco: "", tipo: "corrente", titularidade: "PF", codigo: "", saldoInicial: 0, ativa: true });
  const novoCartao = () => ({ id: uid(), nome: "", banco: "", titularidade: "PF", codigo: "", limite: 0, diaFechamento: 1, diaVencimento: 10, contaDebitoId: "", ativo: true });
  const novaCategoria = () => ({ id: uid(), nome: "", tipo: "despesa", icone: "outros",
    cor: CORES_CAT[Math.floor(Math.random() * CORES_CAT.length)], repetitiva: false, ativa: true });
  const novaAplicacao = () => ({ id: uid(), nome: "", banco: "", titularidade: "PF", tipo: "CDB", contaId: "", historico: [] });

  const mudarLista = (chave, id, campo, valor) =>
    alterar(d => Object.assign({}, d, {
      [chave]: (d[chave] || []).map(x => x.id === id ? Object.assign({}, x, { [campo]: valor }) : x)
    }));
  const addLista = (chave, item) => alterar(d => Object.assign({}, d, { [chave]: (d[chave] || []).concat([item]) }));
  const delLista = (chave, id) => alterar(d => Object.assign({}, d, { [chave]: (d[chave] || []).filter(x => x.id !== id) }));

  /* O codigo da conta e o nome da pasta no Dropbox: sai sozinho de
     PF/PJ + banco, e da para trocar a mao se dois bancos colidirem. */
  const mudarCartaoComCodigo = (id, campo, valor) =>
    alterar(d => Object.assign({}, d, {
      cartoes: (d.cartoes || []).map(c => {
        if (c.id !== id) return c;
        const nova = Object.assign({}, c, { [campo]: valor });
        if (campo !== "codigo") {
          const automatico = paraCodigo((nova.titularidade || "PF") + "-" + (nova.banco || "") + "-CARTAO-" + (nova.nome || ""));
          const anterior = paraCodigo((c.titularidade || "PF") + "-" + (c.banco || "") + "-CARTAO-" + (c.nome || ""));
          if (!c.codigo || c.codigo === anterior) nova.codigo = automatico;
        }
        return nova;
      })
    }));

  const mudarContaComCodigo = (id, campo, valor) =>
    alterar(d => Object.assign({}, d, {
      contas: (d.contas || []).map(c => {
        if (c.id !== id) return c;
        const nova = Object.assign({}, c, { [campo]: valor });
        if (campo !== "codigo") {
          const automatico = paraCodigo((nova.titularidade || "PF") + "-" + (nova.banco || nova.nome || "CONTA"));
          const anterior = paraCodigo((c.titularidade || "PF") + "-" + (c.banco || c.nome || "CONTA"));
          if (!c.codigo || c.codigo === anterior) nova.codigo = automatico;
        }
        return nova;
      })
    }));

  /* Enquanto o desenho ainda for o palpite automatico, ele acompanha
     o nome que esta sendo digitado. Assim que o usuario escolhe um na
     mao, para de mudar sozinho. */
  const mudarCategoriaComIcone = (id, campo, valor) =>
    alterar(d => Object.assign({}, d, {
      categorias: (d.categorias || []).map(c => {
        if (c.id !== id) return c;
        const nova = Object.assign({}, c, { [campo]: valor });
        if (campo === "nome" || campo === "tipo") {
          if (!c.icone || c.icone === adivinharIcone(c.nome, c.tipo)) {
            nova.icone = adivinharIcone(nova.nome, nova.tipo);
          }
        }
        return nova;
      })
    }));

  const exportar = () => {
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prumo-dados-" + dataHojeISO() + ".json";
    a.click();
  };
  const importar = (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    if (!arq) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const env = normalizarEnvelope(JSON.parse(fr.result));
        alterar(() => env);
        setMsg("Arquivo carregado: " + env.lancamentos.length + " lançamento(s).");
      } catch (e) { setMsg("Não consegui ler esse arquivo."); }
    };
    fr.readAsText(arq);
    ev.target.value = "";
  };

  return (
    <div className="space-y-4">
      <h2 className="text-base font-bold">Ajustes</h2>

      {msg ? <Faixa tom="aviso">{msg}</Faixa> : null}

      <Secao titulo="Dropbox" icone={IconCloud}
             sub="É onde o arquivo de dados fica e onde a chave da API viaja entre as versões. Pasta própria do app — não a dos fretes.">
        <div className="space-y-3">
          <Campo label="App Key do app do Dropbox"
                 dica="Já vem preenchida com a chave do app Prumo. Só mexa se você trocar o app do Dropbox.">
            <Entrada value={appKey} onChange={(e) => setAppKey(e.target.value.trim())} placeholder="ex.: a1b2c3d4e5f6g7h" />
          </Campo>
          <Campo label="Endereço de retorno (Redirect URI) — tem que estar cadastrado igualzinho"
                 dica="Cole este endereço em OAuth 2 → Redirect URIs, no app do Dropbox.">
            <div className="flex gap-2">
              <Entrada readOnly value={redirect} />
              <Botao tom="neutro" titulo="Copiar"
                     onClick={() => { try { navigator.clipboard.writeText(redirect); setMsg("Endereço copiado."); } catch (e) { setMsg(redirect); } }}>
                <IconCopy size={15} />
              </Botao>
            </div>
          </Campo>
          <div className="flex flex-wrap items-center gap-2">
            {conectado ? (
              <>
                <span className="text-[13px]" style={{ color: "var(--ok-claro)" }}>● Conectado</span>
                <Botao tom="neutro" onClick={async () => { const p = await dropboxGarantirPastas(codigos); setMsg("Pastas conferidas: " + p.join(", ")); }}>
                  <IconFolder size={15} /> Criar as pastas dos bancos
                </Botao>
                <Botao tom="perigo" onClick={() => { dropboxDesconectar(); setMsg("Desconectado. Recarregue para começar de novo."); }}>Desconectar</Botao>
              </>
            ) : (
              <Botao tom="acento" disabled={!appKey} onClick={() => dropboxIniciarLogin(appKey)}>
                <IconCloud size={15} /> Conectar o Dropbox
              </Botao>
            )}
          </div>
          <div className="text-[12px]" style={{ color: "var(--suave)" }}>
            Estado da carga: {statusCarga === "nuvem" ? "dados vindos do Dropbox"
              : statusCarga === "local" ? "só o arquivo do navegador (Dropbox desconectado)"
              : statusCarga === "carregando" ? "carregando..." : statusCarga === "erro" ? "falhou" : "iniciando"}
            {statusSalvar ? " · gravação: " + (statusSalvar === "salvo" ? "salvo no Dropbox" : statusSalvar === "salvando" ? "salvando..." : statusSalvar === "erro" ? "falhou" : "só local") : ""}
          </div>
          {erroCarga ? <Faixa tom="erro">{erroCarga} <button className="underline" onClick={recarregar}>Tentar de novo</button></Faixa> : null}
        </div>
      </Secao>

      <Secao titulo="Onde mandar os arquivos" icone={IconFolder}
             sub="Dentro da pasta do app no Dropbox (Aplicativos → Prumo). Cada conta E cada cartão tem a sua pasta, porque as faturas são várias e chegam separadas.">
        <div className="space-y-1.5 text-[13px]">
          <div className="font-mono px-2 py-1 rounded" style={{ background: "var(--barra)" }}>/ENTRADA</div>
          <div className="text-[12px] pl-2" style={{ color: "var(--suave)" }}>
            caixa geral: jogue aqui quando não quiser pensar. O app lê o documento e descobre de qual banco é.
          </div>
          {codigos.length ? codigos.map(c => (
            <div key={c}>
              <div className="font-mono px-2 py-1 rounded" style={{ background: "var(--barra)" }}>/ENTRADA/{c}</div>
            </div>
          )) : (
            <div className="text-[12px] pl-2" style={{ color: "var(--suave)" }}>
              Cadastre as contas abaixo e cada uma ganha a sua pasta aqui.
            </div>
          )}
          <div className="text-[12px] pl-2" style={{ color: "var(--suave)" }}>
            uma por conta: o que cai aqui já entra com o banco certo, sem depender da leitura.
          </div>
          <div className="font-mono px-2 py-1 rounded mt-2" style={{ background: "var(--barra)" }}>/LANCADOS</div>
          <div className="text-[12px] pl-2" style={{ color: "var(--suave)" }}>
            para onde o app move o arquivo depois de lançado. Você não mexe aqui.
          </div>
        </div>
      </Secao>

      <Secao titulo="Chave da API da Anthropic" icone={IconSettings}
             sub="Guardada no arquivo do Dropbox, nunca no código — o repositório do GitHub Pages é público. É ela que faz a leitura dos documentos por IA.">
        <div className="flex flex-wrap gap-2 items-end">
          <div className="flex-1" style={{ minWidth: 220 }}>
            <Campo label="Chave">
              <Entrada type={mostrarChave ? "text" : "password"} value={apiKey}
                       onChange={(e) => setApiKey(e.target.value.trim())} placeholder="sk-ant-..." />
            </Campo>
          </div>
          <Botao tom="neutro" onClick={() => setMostrarChave(v => !v)}>{mostrarChave ? "Ocultar" : "Mostrar"}</Botao>
          <Botao tom="acento" onClick={() => { alterar(d => Object.assign({}, d, { config: Object.assign({}, d.config, { apiKey: apiKey }) })); setMsg("Chave guardada no arquivo de dados."); }}>
            <IconCheck size={15} /> Guardar
          </Botao>
        </div>
      </Secao>

      <Secao titulo="Contas" icone={IconBank}
             sub="Uma linha por conta, marcando PF ou PJ. O código é o nome da pasta no Dropbox e a etiqueta na tela.">
        <div className="space-y-2">
          {(dados.contas || []).map(c => (
            <div key={c.id} className="p-2 rounded-md space-y-2" style={{ border: "1px solid var(--linha)" }}>
              <div className="flex items-center gap-2 flex-wrap">
                <SeletorTitular valor={c.titularidade} onValor={(v) => mudarContaComCodigo(c.id, "titularidade", v)} />
                <span className="text-[11px] font-mono px-2 py-1 rounded" style={{ background: "var(--barra)", color: "var(--suave)" }}>
                  /ENTRADA/{c.codigo || "—"}
                </span>
                <Botao tom="perigo" className="ml-auto" onClick={() => delLista("contas", c.id)} titulo="Remover"><IconTrash size={15} /></Botao>
              </div>
              <div className="grade-cad">
                <Campo label="Nome"><Entrada value={c.nome} onChange={(e) => mudarContaComCodigo(c.id, "nome", e.target.value)} placeholder="Ex.: Conta corrente" /></Campo>
                <Campo label="Banco"><Entrada value={c.banco} onChange={(e) => mudarContaComCodigo(c.id, "banco", e.target.value)} placeholder="Ex.: Itaú" /></Campo>
                <Campo label="Tipo">
                  <Selecao value={c.tipo} onChange={(e) => mudarLista("contas", c.id, "tipo", e.target.value)}>
                    <option value="corrente">Corrente</option>
                    <option value="poupanca">Poupança</option>
                    <option value="pagamento">Conta de pagamento</option>
                  </Selecao>
                </Campo>
                <Campo label="Saldo inicial (R$)" dica="O ponto de partida do saldo acumulado do extrato.">
                  <Entrada inputMode="decimal" value={String(c.saldoInicial == null ? "" : c.saldoInicial)}
                           onChange={(e) => mudarLista("contas", c.id, "saldoInicial", paraNumero(e.target.value))} />
                </Campo>
                <Campo label="Código da pasta" dica="Só mexa se dois bancos derem o mesmo código.">
                  <Entrada value={c.codigo || ""} onChange={(e) => mudarLista("contas", c.id, "codigo", paraCodigo(e.target.value))} />
                </Campo>
              </div>
            </div>
          ))}
          <Botao tom="neutro" onClick={() => addLista("contas", novaConta())}><IconPlus size={15} /> Adicionar conta</Botao>
        </div>
      </Secao>

      <Secao titulo="Cartões de crédito" icone={IconCard} sub="Fechamento e vencimento entram aqui — é o que a fatura vai usar para saber em que mês cada compra cai.">
        <div className="space-y-2">
          {(dados.cartoes || []).map(c => (
            <div key={c.id} className="p-2 rounded-md space-y-2" style={{ border: "1px solid var(--linha)" }}>
              <div className="flex items-center gap-2 flex-wrap">
                <SeletorTitular valor={c.titularidade} onValor={(v) => mudarCartaoComCodigo(c.id, "titularidade", v)} />
                <span className="text-[11px] font-mono px-2 py-1 rounded" style={{ background: "var(--barra)", color: "var(--suave)" }}>
                  /ENTRADA/{c.codigo || "—"}
                </span>
                <Botao tom="perigo" className="ml-auto" onClick={() => delLista("cartoes", c.id)} titulo="Remover"><IconTrash size={15} /></Botao>
              </div>
              <div className="grade-cad">
                <Campo label="Nome"><Entrada value={c.nome} onChange={(e) => mudarCartaoComCodigo(c.id, "nome", e.target.value)} placeholder="Ex.: Cartão principal" /></Campo>
                <Campo label="Banco"><Entrada value={c.banco} onChange={(e) => mudarCartaoComCodigo(c.id, "banco", e.target.value)} placeholder="Ex.: Nubank" /></Campo>
                <Campo label="Dia do fechamento"><Entrada type="number" min="1" max="31" value={String(c.diaFechamento == null ? 1 : c.diaFechamento)} onChange={(e) => mudarLista("cartoes", c.id, "diaFechamento", Number(e.target.value) || 1)} /></Campo>
                <Campo label="Dia do vencimento"><Entrada type="number" min="1" max="31" value={String(c.diaVencimento == null ? 10 : c.diaVencimento)} onChange={(e) => mudarLista("cartoes", c.id, "diaVencimento", Number(e.target.value) || 10)} /></Campo>
                <Campo label="Limite (R$)"><Entrada inputMode="decimal" value={String(c.limite == null ? "" : c.limite)} onChange={(e) => mudarLista("cartoes", c.id, "limite", paraNumero(e.target.value))} /></Campo>
                <Campo label="Debita na conta">
                  <Selecao value={c.contaDebitoId || ""} onChange={(e) => mudarLista("cartoes", c.id, "contaDebitoId", e.target.value)}>
                    <option value="">— nenhuma —</option>
                    {(dados.contas || []).map(x => <option key={x.id} value={x.id}>{x.nome || "(sem nome)"}</option>)}
                  </Selecao>
                </Campo>
              </div>
            </div>
          ))}
          <Botao tom="neutro" onClick={() => addLista("cartoes", novoCartao())}><IconPlus size={15} /> Adicionar cartão</Botao>
        </div>
      </Secao>

      <Secao titulo="Aplicações" icone={IconCofre}
             sub="Investimento não é lançamento — é patrimônio. O saldo entra por atualização (na v3, direto do print da tela do banco).">
        <div className="space-y-2">
          {(dados.aplicacoes || []).map(a => (
            <div key={a.id} className="p-2 rounded-md space-y-2" style={{ border: "1px solid var(--linha)" }}>
              <div className="flex items-center gap-2 flex-wrap">
                <SeletorTitular valor={a.titularidade} onValor={(v) => mudarLista("aplicacoes", a.id, "titularidade", v)} />
                <span className="text-[12px]" style={{ color: "var(--suave)" }}>
                  saldo atual {currency(saldoAplicacao(a))}{dataSaldoAplicacao(a) ? " · de " + dataCurta(dataSaldoAplicacao(a)) : ""}
                </span>
                <Botao tom="perigo" className="ml-auto" onClick={() => delLista("aplicacoes", a.id)} titulo="Remover"><IconTrash size={15} /></Botao>
              </div>
              <div className="grade-cad">
                <Campo label="Nome"><Entrada value={a.nome} onChange={(e) => mudarLista("aplicacoes", a.id, "nome", e.target.value)} placeholder="Ex.: CDB liquidez diária" /></Campo>
                <Campo label="Banco"><Entrada value={a.banco} onChange={(e) => mudarLista("aplicacoes", a.id, "banco", e.target.value)} placeholder="Ex.: Itaú" /></Campo>
                <Campo label="Tipo">
                  <Selecao value={a.tipo} onChange={(e) => mudarLista("aplicacoes", a.id, "tipo", e.target.value)}>
                    {["CDB","Poupança","Fundo","Tesouro Direto","LCI/LCA","Ações","Outro"].map(t => <option key={t} value={t}>{t}</option>)}
                  </Selecao>
                </Campo>
                <Campo label="Ligada à conta">
                  <Selecao value={a.contaId || ""} onChange={(e) => mudarLista("aplicacoes", a.id, "contaId", e.target.value)}>
                    <option value="">— nenhuma —</option>
                    {(dados.contas || []).map(x => <option key={x.id} value={x.id}>{x.nome || "(sem nome)"}</option>)}
                  </Selecao>
                </Campo>
              </div>
            </div>
          ))}
          <Botao tom="neutro" onClick={() => addLista("aplicacoes", novaAplicacao())}><IconPlus size={15} /> Adicionar aplicação</Botao>
        </div>
      </Secao>

      <Secao titulo="Categorias" icone={IconTag}
             sub="Cada categoria tem o seu desenho — é ele que identifica na lista, no gráfico e no papel, onde a cor pode sumir. O desenho acompanha o nome digitado até você escolher um na mão. “Repete por natureza” marca o que acontece duas vezes no mesmo dia de verdade (mercado, combustível, refeição): essas nunca vêm pré-marcadas na tela de duplicados.">
        <div className="space-y-1.5">
          {(dados.categorias || []).map(c => (
            <div key={c.id} className="flex items-center gap-2 flex-wrap p-2 rounded-md" style={{ border: "1px solid var(--linha)" }}>
              <SeletorIcone valor={c.icone} cor={c.cor} onValor={(v) => mudarLista("categorias", c.id, "icone", v)} />
              <input type="color" value={c.cor || "#64748B"} onChange={(e) => mudarLista("categorias", c.id, "cor", e.target.value)}
                     style={{ width: 28, height: 28, background: "transparent", border: "0", padding: 0 }} title="Cor" />
              <Entrada value={c.nome} onChange={(e) => mudarCategoriaComIcone(c.id, "nome", e.target.value)}
                       style={{ flex: "1 1 140px", width: "auto" }} placeholder="Nome da categoria" />
              <Selecao value={c.tipo} onChange={(e) => mudarCategoriaComIcone(c.id, "tipo", e.target.value)} style={{ width: "auto" }}>
                <option value="despesa">Despesa</option>
                <option value="receita">Receita</option>
              </Selecao>
              <label className="flex items-center gap-1.5 text-[12px]" style={{ color: "var(--suave)" }}>
                <input type="checkbox" checked={!!c.repetitiva} onChange={(e) => mudarLista("categorias", c.id, "repetitiva", e.target.checked)} />
                repete por natureza
              </label>
              <Botao tom="perigo" onClick={() => delLista("categorias", c.id)} titulo="Remover"><IconTrash size={15} /></Botao>
            </div>
          ))}
          <div className="flex gap-2 pt-1">
            <Botao tom="neutro" onClick={() => addLista("categorias", novaCategoria())}><IconPlus size={15} /> Adicionar categoria</Botao>
            <Botao tom="neutro" onClick={() => alterar(d => Object.assign({}, d, { categorias: categoriasIniciais() }))}>
              <IconRefresh size={15} /> Voltar à lista padrão
            </Botao>
          </div>
        </div>
      </Secao>

      <Secao titulo="Procurar duplicados" icone={IconAlert}
             sub="A varredura completa da base. Serve para o caso de a mesma compra ter entrado pela foto e pela linha do extrato.">
        <PainelDuplicados dados={dados} onRemover={(ids) => {
          alterar(d => Object.assign({}, d, { lancamentos: (d.lancamentos || []).filter(l => ids.indexOf(l.id) < 0) }));
          setMsg(ids.length + " lançamento(s) apagado(s).");
        }} />
      </Secao>

      <Secao titulo="Dados e versão" icone={IconGrid}>
        <div className="flex flex-wrap gap-2 items-center">
          <Botao tom="neutro" onClick={exportar}><IconDownload size={15} /> Baixar cópia (.json)</Botao>
          <label className="inline-flex items-center justify-center gap-2 rounded-md px-3 py-2 text-sm font-semibold cursor-pointer"
                 style={{ background: "var(--superficie)", color: "var(--texto)", border: "1px solid var(--borda)" }}>
            <IconUpload size={15} /> Carregar cópia
            <input type="file" accept="application/json,.json" onChange={importar} style={{ display: "none" }} />
          </label>
          <Botao tom="neutro" onClick={() => { salvarAgora(); setMsg("Gravação enviada ao Dropbox."); }}><IconCheck size={15} /> Salvar agora</Botao>
          <Botao tom="neutro" onClick={recarregar}><IconRefresh size={15} /> Recarregar do Dropbox</Botao>
          <Botao tom="neutro" onClick={() => { try { localStorage.removeItem(LS_KEYS.cacheIa); setMsg("Cache de leitura por IA limpo."); } catch (e) {} }}>
            Limpar cache de leitura
          </Botao>
        </div>
        <div className="text-[12px] mt-3" style={{ color: "var(--suave)" }}>
          {NOME_APP} {APP_VERSION} · {(dados.lancamentos || []).length} lançamento(s) ·
          {" "}{(dados.contas || []).length} conta(s) · {(dados.contratos || []).length} contrato(s) ·
          {" "}último salvamento: {dados.salvoEm ? new Date(dados.salvoEm).toLocaleString("pt-BR") : "nunca"}
        </div>
      </Secao>
    </div>
  );
}


/* ===========================================================
   RAIZ — casca do app, abas e o retorno do Dropbox
=========================================================== */
function App() {
  const { dados, alterar, dadosProntos, statusCarga, statusSalvar, erroCarga, recarregar, salvarAgora } = useDados();
  const [aba, setAba] = useState("resumo");
  const [mes, setMes] = useState(mesHoje());
  const [modal, setModal] = useState(null); // null | { inicial }
  const [avisoDbx, setAvisoDbx] = useState("");

  // A lista mais fresca, para a segunda checagem de duplicidade no
  // instante do clique — nunca uma copia presa numa renderizacao antiga.
  const refLancamentos = useRef(dados.lancamentos || []);
  useEffect(() => { refLancamentos.current = dados.lancamentos || []; }, [dados.lancamentos]);

  // Retorno do Dropbox: o ?code= chega aqui porque o carregador repassa
  // location.search e location.hash para o app.html.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (!code) return;
    (async () => {
      const ok = await dropboxTrocarCodigoPorToken(code);
      // limpa o endereco para o codigo nao ser reaproveitado num F5
      const limpo = window.location.origin + window.location.pathname;
      try { window.history.replaceState({}, "", limpo); } catch (e) {}
      if (ok) {
        const env = lsGet(LS_KEYS.dados) || {};
        const codigos = (env.contas || []).concat(env.cartoes || []).map(c => c.codigo).filter(Boolean);
        await dropboxGarantirPastas(codigos);
        setAvisoDbx(""); recarregar();
      }
      else setAvisoDbx("O Dropbox recusou a autorização. Confira se o endereço de retorno cadastrado é exatamente " + dropboxRedirectUri());
    })();
  }, [recarregar]);

  const salvarLancamento = (l) => {
    alterar(d => {
      const existe = (d.lancamentos || []).some(x => x.id === l.id);
      return Object.assign({}, d, {
        lancamentos: existe ? d.lancamentos.map(x => x.id === l.id ? l : x) : (d.lancamentos || []).concat([l])
      });
    });
    setMes(mesDaData(l.data));
    setModal(null);
  };
  const excluirLancamento = (id) => {
    alterar(d => Object.assign({}, d, { lancamentos: (d.lancamentos || []).filter(x => x.id !== id) }));
    setModal(null);
  };

  const ABAS = [
    { id: "resumo", rotulo: "Resumo", icone: IconGrid },
    { id: "bancos", rotulo: "Bancos", icone: IconBank },
    { id: "lancamentos", rotulo: "Lançamentos", icone: IconList },
    { id: "graficos", rotulo: "Gráficos", icone: IconTrendUp },
    { id: "contratos", rotulo: "Contratos", icone: IconContrato },
    { id: "config", rotulo: "Ajustes", icone: IconSettings }
  ];

  return (
    <div style={{ minHeight: "100vh", background: "var(--fundo)" }}>
      <AvisoVersaoNova />

      <header className="no-print" style={{ background: "var(--barra)", borderBottom: "1px solid var(--borda)" }}>
        <div className="mx-auto max-w-5xl px-3 py-2.5 flex items-center gap-2.5">
          <LogoMark size={26} />
          <div className="flex-1">
            <div className="text-[15px] font-bold leading-none" style={{ color: "var(--na-barra)", fontFamily: "'Oswald', sans-serif", letterSpacing: ".06em", textTransform: "uppercase" }}>
              {NOME_APP}
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: "var(--na-barra-suave)" }}>controle de finanças pessoais</div>
          </div>
          <span className="text-[11px] font-semibold px-1.5 py-0.5 rounded"
                style={{ color: "var(--sobre-acento)", background: "var(--acento-vivo)", fontFamily: "'JetBrains Mono', monospace" }}>
            {APP_VERSION}
          </span>
        </div>
        <div className="mx-auto max-w-5xl px-3 pb-2 flex gap-1.5 overflow-x-auto">
          {ABAS.map(a => {
            const ativa = aba === a.id;
            return (
              <button key={a.id} onClick={() => setAba(a.id)}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[13px] font-semibold whitespace-nowrap"
                style={{
                  background: ativa ? "var(--aba-ativa-bg)" : "transparent",
                  color: ativa ? "var(--aba-ativa-txt)" : "var(--na-barra-suave)",
                  border: "1px solid " + (ativa ? "var(--aba-ativa-txt)" : "transparent")
                }}>
                <a.icone size={14} /> {a.rotulo}
              </button>
            );
          })}
        </div>
      </header>

      <main className="mx-auto max-w-5xl px-3 py-4 space-y-3" style={{ paddingBottom: 90 }}>
        {!dadosProntos && statusCarga === "carregando" ? (
          <Faixa tom="aviso">
            <span className="inline-flex items-center gap-2"><IconLoader size={14} /> Carregando os lançamentos do Dropbox. O botão de lançar só liga quando terminar.</span>
          </Faixa>
        ) : null}
        {!dadosProntos && statusCarga === "erro" ? (
          <Faixa tom="erro">
            {erroCarga} <b>O lançamento fica travado</b> até os dados chegarem — é o que impede lançar em cima de uma lista vazia e duplicar tudo.{" "}
            <button className="underline" onClick={recarregar}>Tentar de novo</button>
          </Faixa>
        ) : null}
        {avisoDbx ? <Faixa tom="erro">{avisoDbx}</Faixa> : null}
        {!dropboxEstaConectado() ? (
          <Faixa tom="aviso">
            O Dropbox ainda não está conectado. Enquanto isso os lançamentos ficam só neste navegador.
            Vá em <b>Ajustes → Dropbox</b> para conectar.
          </Faixa>
        ) : null}

        {aba === "resumo" ? <AbaResumo dados={dados} mes={mes} onMes={setMes} /> : null}
        {aba === "bancos" ? <AbaBancos dados={dados} alterar={alterar} mes={mes} /> : null}
        {aba === "contratos" ? <AbaContratos dados={dados} alterar={alterar} /> : null}
        {aba === "graficos" ? <AbaGraficos dados={dados} mes={mes} onMes={setMes} /> : null}
        {aba === "lancamentos" ? (
          <AbaLancamentos dados={dados} mes={mes} onMes={setMes} dadosProntos={dadosProntos}
                          onNovo={() => setModal({ inicial: null })}
                          onEditar={(l) => setModal({ inicial: l })} />
        ) : null}
        {aba === "config" ? (
          <AbaConfig dados={dados} alterar={alterar} statusCarga={statusCarga} statusSalvar={statusSalvar}
                     erroCarga={erroCarga} recarregar={recarregar} salvarAgora={salvarAgora} />
        ) : null}
      </main>

      {modal ? (
        <ModalLancamento inicial={modal.inicial} dados={dados} refLancamentos={refLancamentos}
                         dadosProntos={dadosProntos} onSalvar={salvarLancamento}
                         onExcluir={excluirLancamento} onClose={() => setModal(null)} />
      ) : null}

      {/* O botao redondo fica so no Resumo: na aba de Lancamentos ja existe
          o "Novo" no alto, e dois botoes iguais atrapalham a leitura da lista. */}
      {aba === "resumo" ? (
        <button onClick={() => setModal({ inicial: null })} disabled={!dadosProntos}
          title={dadosProntos ? "Novo lançamento" : "Carregando lançamentos..."}
          className="no-print fixed rounded-full flex items-center justify-center"
          style={{
            right: 18, bottom: 22, width: 54, height: 54,
            background: dadosProntos ? "var(--acento)" : "var(--borda)",
            color: "#FFFFFF", border: 0, boxShadow: "0 6px 18px rgba(0,0,0,.45)",
            cursor: dadosProntos ? "pointer" : "not-allowed"
          }}>
          {dadosProntos ? <IconPlus size={24} /> : <IconLoader size={22} />}
        </button>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
<script>
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }], "env"]
    }).code;
    var el = document.createElement("script");
    el.textContent = output;
    document.body.appendChild(el);
  })();
</script>
</body>
</html>
