function Vazio({ texto }) {
  return (
    <div className="text-center py-10 text-sm" style={{ color: "var(--suave)" }}>{texto}</div>
  );
}

function Modal({ titulo, onClose, children, largura = 560 }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    return () => document.removeEventListener("keydown", esc);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 no-print"
         style={{ background: "rgba(0,0,0,0.7)" }} onClick={onClose}>
      <div className="w-full rounded-t-xl sm:rounded-xl overflow-hidden flex flex-col"
           style={{ maxWidth: largura, maxHeight: "92vh", background: "var(--fundo)", border: "1px solid var(--borda)" }}
           onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 shrink-0"
             style={{ background: "var(--barra)", borderBottom: "1px solid var(--borda)" }}>
          <h3 className="text-sm font-bold" style={{ color: "var(--na-barra)" }}>{titulo}</h3>
          <button onClick={onClose} style={{ color: "var(--na-barra-suave)" }} aria-label="Fechar"><IconX size={20} /></button>
        </div>
        <div className="p-4 overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

function Faixa({ tom = "aviso", children }) {
  const fundo = tom === "erro" ? "var(--erro-bg)" : "var(--aviso-bg)";
  const borda = tom === "erro" ? "var(--erro-borda)" : "var(--aviso-borda)";
  const cor   = tom === "erro" ? "var(--erro-txt)" : "var(--ouro-escuro)";
  return (
    <div className="flex items-start gap-2 rounded-md px-3 py-2 text-[13px] no-print"
         style={{ background: fundo, border: "1px solid " + borda, color: cor }}>
      <IconAlert size={15} className="shrink-0 mt-0.5" />
      <div>{children}</div>
    </div>
  );
}

/* Confere se o arquivo publicado e mais novo que o que esta rodando.
   Atualiza sozinho uma vez por sessao, com endereco carimbado — sem
   isso um atalho salvo continua servindo a copia velha do cache. */
function AvisoVersaoNova() {
  const [nova, setNova] = useState(null);
  useEffect(() => {
    if (!/^https?:/.test(location.protocol)) return;
    const alvo = location.origin + location.pathname;
    fetch(alvo + "?checar=" + Date.now(), { cache: "no-store" })
      .then(r => (r.ok ? r.text() : null))
      .then(txt => {
        if (!txt) return;
        const m = txt.match(/APP_VERSION = "(v\d+)"/);
        if (!m || m[1] === APP_VERSION) return;
        setNova(m[1]);
        try {
          if (!sessionStorage.getItem("prumo_autoatualizou")) {
            sessionStorage.setItem("prumo_autoatualizou", m[1]);
            location.replace(alvo + "?v=" + m[1] + "." + Date.now());
            return;
          }
        } catch (e) { /* sem sessionStorage: fica so o aviso com o botao */ }
      })
      .catch(() => {});
  }, []);
  if (!nova) return null;
  return (
    <div className="no-print" style={{ background: "var(--acento)", color: "var(--superficie)", padding: "8px 12px",
                  display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13 }}>
      <span>Existe uma versão mais nova publicada ({nova}). Você está na {APP_VERSION}.</span>
      <button onClick={() => { location.replace(location.origin + location.pathname + "?v=" + nova + "." + Date.now()); }}
        style={{ background: "var(--barra)", color: "var(--superficie)", border: 0, borderRadius: 6,
                 padding: "5px 12px", fontWeight: 700, cursor: "pointer" }}>
        Atualizar agora
      </button>
    </div>
  );
}


/* ===========================================================
   SELETOR DE MES
=========================================================== */
function SeletorMes({ mes, onMes }) {
  return (
    <div className="flex items-center gap-1 no-print">
      <button onClick={() => onMes(mesSomado(mes, -1))} title="Mês anterior"
        className="px-2 py-1.5 rounded-md text-sm" style={{ background: "var(--superficie)", border: "1px solid var(--borda)", color: "var(--texto)" }}>‹</button>
      <div className="px-3 py-1.5 rounded-md text-sm font-semibold text-center" style={{ minWidth: 150, background: "var(--superficie)", border: "1px solid var(--borda)" }}>
        {mesPorExtenso(mes)}
      </div>
      <button onClick={() => onMes(mesSomado(mes, 1))} title="Próximo mês"
        className="px-2 py-1.5 rounded-md text-sm" style={{ background: "var(--superficie)", border: "1px solid var(--borda)", color: "var(--texto)" }}>›</button>
    </div>
  );
}

/* ===========================================================
   MODAL DE LANCAMENTO (digitacao manual — o gasto em dinheiro)
   Traz a SEGUNDA checagem de duplicidade, feita no ato de
   lancar contra o estado atual, e nunca decide sozinha.
=========================================================== */
function ModalLancamento({ inicial, dados, refLancamentos, dadosProntos, onSalvar, onExcluir, onClose }) {
  const base = inicial || {};
  const [tipo, setTipo] = useState(base.tipo || "despesa");
  const [data, setData] = useState(base.data || dataHojeISO());
  const [valor, setValor] = useState(base.valor != null ? String(base.valor).replace(".", ",") : "");
  const [categoria, setCategoria] = useState(base.categoria || "");
  const [estabelecimento, setEstabelecimento] = useState(base.estabelecimento || "");
  const [forma, setForma] = useState(base.forma || "dinheiro");
  const [contaId, setContaId] = useState(base.contaId || "");
  const [cartaoId, setCartaoId] = useState(base.cartaoId || "");
  const [descricao, setDescricao] = useState(base.descricao || "");
  const [avisos, setAvisos] = useState([]);
  const [candidatos, setCandidatos] = useState(null);

  const editando = !!(inicial && inicial.id);
  const cats = (dados.categorias || []).filter(c => c.tipo === tipo && c.ativa !== false);
  const f = formaPorId(forma);

  const montar = () => ({
    id: editando ? inicial.id : uid(),
    tipo: tipo,
    data: data,
    valor: paraNumero(valor),
    categoria: categoria,
    estabelecimento: estabelecimento.trim(),
    descricao: descricao.trim(),
    forma: forma,
    contaId: f.usaConta ? contaId : "",
    cartaoId: f.usaCartao ? cartaoId : "",
    origem: (inicial && inicial.origem) || "manual",
    origemRef: (inicial && inicial.origemRef) || null,
    criadoEm: (inicial && inicial.criadoEm) || new Date().toISOString(),
    atualizadoEm: new Date().toISOString()
  });

  const validar = (l) => {
    const e = [];
    if (!l.data) e.push("Falta a data.");
    if (!(l.valor > 0)) e.push("O valor tem que ser maior que zero.");
    if (!l.categoria) e.push("Escolha a categoria.");
    if (f.usaConta && !l.contaId && (dados.contas || []).length) e.push("Escolha a conta.");
    if (f.usaCartao && !l.cartaoId) e.push((dados.cartoes || []).length ? "Escolha o cartão." : "Cadastre um cartão nas Configurações antes de lançar no crédito.");
    return e;
  };

  const tentarSalvar = () => {
    const l = montar();
    const e = validar(l);
    if (e.length) { setAvisos(e); return; }
    setAvisos([]);
    // SEGUNDA CHECAGEM: contra a lista de verdade, no instante do clique.
    const lista = (refLancamentos && refLancamentos.current) || dados.lancamentos || [];
    const achados = procurarPossivelDuplicado(lista, l);
    if (achados.length && !editando) { setCandidatos({ novo: l, achados: achados }); return; }
    onSalvar(l);
  };

  if (candidatos) {
    return (
      <Modal titulo="Isto já está lançado?" onClose={() => setCandidatos(null)}>
        <div className="space-y-3">
          <Faixa tom="aviso">
            Achei {candidatos.achados.length === 1 ? "um lançamento parecido" : candidatos.achados.length + " lançamentos parecidos"}.
            Confira antes de lançar — a mesma compra costuma chegar duas vezes (pela foto e pela linha do extrato).
          </Faixa>
          <div className="space-y-2">
            {candidatos.achados.map((a) => (
              <Cartao key={a.lancamento.id} className="p-3">
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-sm font-semibold">{a.lancamento.estabelecimento || a.lancamento.descricao || "(sem nome)"}</div>
                    <div className="text-[11px]" style={{ color: "var(--suave)" }}>
                      {dataCurta(a.lancamento.data)} · {a.dias === 0 ? "mesmo dia" : a.dias + " dia(s) de diferença"} · origem: {a.lancamento.origem || "manual"}
                    </div>
                  </div>
                  <div className="text-sm font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(a.lancamento.valor)}</div>
                </div>
              </Cartao>
            ))}
          </div>
          <div className="flex flex-wrap gap-2 pt-1">
            <Botao tom="neutro" onClick={() => setCandidatos(null)}>Voltar e conferir</Botao>
            <Botao tom="acento" onClick={() => { onSalvar(candidatos.novo); setCandidatos(null); }}>
              <IconCheck size={15} /> É outro gasto, pode lançar
            </Botao>
          </div>
        </div>
      </Modal>
    );
  }

  return (
    <Modal titulo={editando ? "Editar lançamento" : "Novo lançamento"} onClose={onClose}>
      <div className="space-y-3">
        <div className="flex gap-2">
          {["despesa", "receita"].map(t => (
            <button key={t} onClick={() => { setTipo(t); setCategoria(""); }}
              className="flex-1 py-2 rounded-md text-sm font-semibold"
              style={{
                background: tipo === t ? "var(--selecionado-bg)" : "var(--superficie)",
                color: tipo === t ? "var(--selecionado-txt)" : "var(--texto)",
                border: "1px solid " + (tipo === t ? "var(--selecionado-bg)" : "var(--borda)")
              }}>
              {t === "despesa" ? "Saiu (despesa)" : "Entrou (receita)"}
            </button>
          ))}
        </div>

        <div className="grade-form">
          <Campo label="Data"><Entrada type="date" value={data} onChange={(e) => setData(e.target.value)} /></Campo>
          <Campo label="Valor (R$)"><Entrada inputMode="decimal" placeholder="0,00" value={valor} onChange={(e) => setValor(e.target.value)} /></Campo>
        </div>

        <Campo label="Categoria">
          <div className="flex items-center gap-2">
            <span style={{ width: 34, height: 34, borderRadius: 8, display: "inline-flex", alignItems: "center",
                           justifyContent: "center", background: "var(--superficie)", border: "1px solid var(--borda)" }}>
              <MarcaCategoria categoria={cats.filter(c => c.id === categoria)[0]} size={18} />
            </span>
            <Selecao value={categoria} onChange={(e) => setCategoria(e.target.value)}>
              <option value="">— escolha —</option>
              {cats.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </Selecao>
          </div>
        </Campo>

        <Campo label={tipo === "despesa" ? "Onde foi (estabelecimento)" : "De onde veio"}>
          <Entrada value={estabelecimento} onChange={(e) => setEstabelecimento(e.target.value)}
                   placeholder={tipo === "despesa" ? "Ex.: Supermercado Angeloni" : "Ex.: GVGS"} />
        </Campo>

        <div className="grade-form">
          <Campo label="Forma">
            <Selecao value={forma} onChange={(e) => setForma(e.target.value)}>
              {FORMAS.map(x => <option key={x.id} value={x.id}>{x.rotulo}</option>)}
            </Selecao>
          </Campo>
          {f.usaConta ? (
            <Campo label="Conta">
              <Selecao value={contaId} onChange={(e) => setContaId(e.target.value)}>
                <option value="">— escolha —</option>
                {(dados.contas || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </Selecao>
            </Campo>
          ) : f.usaCartao ? (
            <Campo label="Cartão">
              <Selecao value={cartaoId} onChange={(e) => setCartaoId(e.target.value)}>
                <option value="">— escolha —</option>
                {(dados.cartoes || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </Selecao>
            </Campo>
          ) : <div />}
        </div>

        <Campo label="Observação (opcional)">
          <Entrada value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Uma linha para lembrar depois" />
        </Campo>

        {avisos.length ? <Faixa tom="erro">{avisos.map((a, i) => <div key={i}>{a}</div>)}</Faixa> : null}

        <div className="flex flex-wrap items-center gap-2 pt-1">
          <Botao tom="acento" onClick={tentarSalvar} disabled={!dadosProntos}
                 titulo={dadosProntos ? "" : "Esperando os lançamentos carregarem"}>
            <IconCheck size={15} /> {dadosProntos ? (editando ? "Salvar" : "Lançar") : "Carregando lançamentos..."}
          </Botao>
          <Botao tom="neutro" onClick={onClose}>Cancelar</Botao>
          {editando ? (
            <Botao tom="perigo" className="ml-auto" onClick={() => onExcluir(inicial.id)}>
              <IconTrash size={15} /> Excluir
            </Botao>
          ) : null}
        </div>
      </div>
    </Modal>
  );
}

/* ===========================================================
   ABA RESUMO — quanto entrou, quanto saiu, o que sobrou,
   e a despesa por categoria comparada com o mes anterior.
=========================================================== */
function AbaResumo({ dados, mes, onMes }) {
  const [filtro, setFiltro] = useState("TUDO");
  const catPorId = useMemo(() => {
    const m = {}; (dados.categorias || []).forEach(c => { m[c.id] = c; }); return m;
  }, [dados.categorias]);
  const mapaContas = indexarPorId(dados.contas);
  const mapaCartoes = indexarPorId(dados.cartoes);
  const cabe = (l) => filtro === "TUDO" || titularidadeDoLancamento(l, mapaContas, mapaCartoes) === filtro;

  const doMes = (mm) => (dados.lancamentos || []).filter(l => mesDaData(l.data) === mm).filter(cabe);
  const atual = doMes(mes);
  const anterior = doMes(mesSomado(mes, -1));

  const soma = (lista, tipo) => lista.filter(l => (l.tipo || "despesa") === tipo)
                                     .reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const entrou = soma(atual, "receita");
  const saiu   = soma(atual, "despesa");
  const sobrou = entrou - saiu;
  const saiuAnterior = soma(anterior, "despesa");
  const noCartao = atual.filter(l => l.cartaoId).reduce((s, l) => s + (Number(l.valor) || 0), 0);

  const porCategoria = useMemo(() => {
    const acc = {};
    atual.filter(l => (l.tipo || "despesa") === "despesa").forEach(l => {
      const k = l.categoria || "sem";
      acc[k] = (acc[k] || 0) + (Number(l.valor) || 0);
    });
    const accAnt = {};
    anterior.filter(l => (l.tipo || "despesa") === "despesa").forEach(l => {
      const k = l.categoria || "sem";
      accAnt[k] = (accAnt[k] || 0) + (Number(l.valor) || 0);
    });
    return Object.keys(acc).map(k => ({
      id: k,
      nome: (catPorId[k] && catPorId[k].nome) || "Sem categoria",
      cor: (catPorId[k] && catPorId[k].cor) || "#64748B",
      valor: acc[k],
      antes: accAnt[k] || 0
    })).sort((a, b) => b.valor - a.valor);
  }, [atual, anterior, catPorId]);

  const maior = porCategoria.length ? porCategoria[0].valor : 0;
  const deltaMes = saiuAnterior > 0 ? ((saiu - saiuAnterior) / saiuAnterior) * 100 : null;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-base font-bold">
          Resumo de {mesPorExtenso(mes)}{filtro === "TUDO" ? "" : " · " + filtro}
        </h2>
        <div className="flex items-center gap-2 flex-wrap">
          <FiltroTitular valor={filtro} onValor={setFiltro} />
          <SeletorMes mes={mes} onMes={onMes} />
        </div>
      </div>

      <div className="grade-totais" style={{ background: "var(--borda)", border: "1px solid var(--borda)" }}>
        <StatCard label="Entrou" valor={currency(entrou)} icone={IconTrendUp} tom="ok" />
        <StatCard label="Saiu" valor={currency(saiu)} icone={IconTrendDown} tom="perigo"
                  rodape={deltaMes == null ? "sem mês anterior" :
                    (deltaMes >= 0 ? "+" : "") + deltaMes.toFixed(0) + "% vs. mês anterior"} />
        <StatCard label="Sobrou" valor={currency(sobrou)} icone={IconWallet} tom={sobrou >= 0 ? "ok" : "perigo"} />
        <StatCard label="No cartão" valor={currency(noCartao)} icone={IconCard} />
      </div>

      <Cartao className="p-4">
        <div className="flex items-center gap-2 mb-3">
          <IconTag size={15} style={{ color: "var(--acento-vivo)" }} />
          <h3 className="text-sm font-bold">Despesas por categoria</h3>
        </div>
        {porCategoria.length === 0 ? (
          <Vazio texto="Nenhuma despesa neste mês ainda." />
        ) : (
          <div className="space-y-2.5">
            {porCategoria.map(c => {
              const dif = c.antes > 0 ? ((c.valor - c.antes) / c.antes) * 100 : null;
              return (
                <div key={c.id}>
                  <div className="flex items-baseline justify-between gap-2 text-[13px]">
                    <span className="font-semibold inline-flex items-center gap-1.5">
                      <MarcaCategoria categoria={catPorId[c.id]} size={15} /> {c.nome}
                    </span>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(c.valor)}</span>
                  </div>
                  <div className="h-1.5 rounded mt-1" style={{ background: "var(--linha)" }}>
                    <div className="h-1.5 rounded" style={{ width: (maior ? (c.valor / maior) * 100 : 0) + "%", background: c.cor }} />
                  </div>
                  <div className="text-[11px] mt-0.5" style={{ color: "var(--suave)" }}>
                    mês anterior {currency(c.antes)}
                    {dif == null ? "" : " · " + (dif >= 0 ? "+" : "") + dif.toFixed(0) + "%"}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Cartao>
    </div>
  );
}

/* ===========================================================
   ABA LANCAMENTOS
=========================================================== */
function AbaLancamentos({ dados, mes, onMes, onEditar, onNovo, dadosProntos }) {
  const [filtro, setFiltro] = useState("TUDO");
  const [onde, setOnde] = useState("");
  const catPorId = indexarPorId(dados.categorias);
  const contaPorId = indexarPorId(dados.contas);
  const cartaoPorId = indexarPorId(dados.cartoes);
  const cabe = (l) => filtro === "TUDO" || titularidadeDoLancamento(l, contaPorId, cartaoPorId) === filtro;
  const cabeOnde = (l) => !onde || l.contaId === onde || l.cartaoId === onde;

  const lista = (dados.lancamentos || [])
    .filter(l => mesDaData(l.data) === mes)
    .filter(cabe).filter(cabeOnde)
    .sort((a, b) => String(b.data).localeCompare(String(a.data)) ||
                    String(b.criadoEm || "").localeCompare(String(a.criadoEm || "")));

  const ondeSaiu = (l) => l.cartaoId ? ((cartaoPorId[l.cartaoId] || {}).nome || "cartão")
                        : l.contaId ? ((contaPorId[l.contaId] || {}).nome || "conta")
                        : formaPorId(l.forma).rotulo;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-base font-bold">Lançamentos</h2>
        <div className="flex items-center gap-2 flex-wrap no-print">
          <FiltroTitular valor={filtro} onValor={setFiltro} />
          <Selecao value={onde} onChange={(e) => setOnde(e.target.value)} style={{ width: "auto" }}>
            <option value="">Todas as contas e cartões</option>
            {(dados.contas || []).map(c => <option key={c.id} value={c.id}>{c.nome || c.codigo} · {c.banco}</option>)}
            {(dados.cartoes || []).map(c => <option key={c.id} value={c.id}>Cartão {c.nome} · {c.banco}</option>)}
          </Selecao>
          <SeletorMes mes={mes} onMes={onMes} />
          <Botao tom="acento" onClick={onNovo} disabled={!dadosProntos}>
            <IconPlus size={15} /> {dadosProntos ? "Novo" : "Carregando lançamentos..."}
          </Botao>
        </div>
      </div>

      {lista.length === 0 ? (
        <Cartao><Vazio texto={"Nenhum lançamento em " + mesPorExtenso(mes) + "."} /></Cartao>
      ) : (
        <Cartao className="overflow-hidden">
          <div className="rolagem-resp" style={{ overflowX: "auto" }}>
            <table className="tab-resp w-full text-[13px]">
              <thead>
                <tr style={{ background: "var(--barra)", color: "var(--na-barra-suave)" }}>
                  <th className="text-left font-semibold px-3 py-2">Data</th>
                  <th className="text-left font-semibold px-3 py-2">Descrição</th>
                  <th className="text-left font-semibold px-3 py-2">Categoria</th>
                  <th className="text-left font-semibold px-3 py-2">Onde</th>
                  <th className="text-right font-semibold px-3 py-2">Valor</th>
                  <th className="px-3 py-2 no-print"></th>
                </tr>
              </thead>
              <tbody>
                {lista.map(l => {
                  const cat = catPorId[l.categoria];
                  const receita = (l.tipo || "despesa") === "receita";
                  return (
                    <tr key={l.id} style={{ borderTop: "1px solid var(--linha)" }}>
                      <td className="px-3 py-2" data-rot="Data" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{dataCurta(l.data)}</td>
                      <td className="px-3 py-2" data-rot="Descrição">
                        <div className="font-semibold">{l.estabelecimento || l.descricao || "(sem nome)"}</div>
                        {l.estabelecimento && l.descricao ? <div className="text-[11px]" style={{ color: "var(--suave)" }}>{l.descricao}</div> : null}
                      </td>
                      <td className="px-3 py-2" data-rot="Categoria">
                        <span className="inline-flex items-center gap-1.5">
                          <MarcaCategoria categoria={cat} size={15} />
                          {(cat && cat.nome) || "Sem categoria"}
                        </span>
                      </td>
                      <td className="px-3 py-2" data-rot="Onde" style={{ color: "var(--suave)" }}>{ondeSaiu(l)}</td>
                      <td className="px-3 py-2 text-right" data-rot="Valor"
                          style={{ fontFamily: "'JetBrains Mono', monospace", color: receita ? "var(--ok-claro)" : "var(--texto)" }}>
                        {receita ? "+" : "−"} {currency(l.valor)}
                      </td>
                      <td className="px-3 py-2 text-right no-print">
                        <button onClick={() => onEditar(l)} title="Editar" style={{ color: "var(--suave)" }}><IconEdit size={15} /></button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Cartao>
      )}
    </div>
  );
}


/* ===========================================================
   ABA BANCOS — a situacao de cada banco, e os sinteticos PF e PJ
=========================================================== */
function ChipTitular({ valor }) {
  const pj = valor === "PJ";
  return (
    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded"
          style={{ background: pj ? "rgba(56,189,248,.18)" : "var(--chip-quente)",
                   color: pj ? "#7DD3FC" : "var(--acento-vivo)" }}>{valor || "PF"}</span>
  );
}

function FiltroTitular({ valor, onValor }) {
  return (
    <div className="flex gap-1 no-print">
      {[{ id: "TUDO", r: "Tudo" }, { id: "PF", r: "PF" }, { id: "PJ", r: "PJ" }].map(o => (
        <button key={o.id} onClick={() => onValor(o.id)}
          className="px-3 py-1.5 rounded-md text-[13px] font-semibold"
          style={{
            background: valor === o.id ? "var(--selecionado-bg)" : "var(--superficie)",
            color: valor === o.id ? "var(--selecionado-txt)" : "var(--texto)",
            border: "1px solid " + (valor === o.id ? "var(--selecionado-bg)" : "var(--borda)")
          }}>{o.r}</button>
      ))}
    </div>
  );
}

function AbaBancos({ dados, alterar, mes }) {
  const [filtro, setFiltro] = useState("TUDO");
  const [aberta, setAberta] = useState(null);   // conta com extrato aberto
  const [cartaoAberto, setCartaoAberto] = useState(null); // cartao com fatura aberta
  const [novaApl, setNovaApl] = useState(null); // aplicacao sendo atualizada

  const mapaContas = indexarPorId(dados.contas);
  const mapaCartoes = indexarPorId(dados.cartoes);
  const cabe = (t) => filtro === "TUDO" || (t || "PF") === filtro;

  const contas = (dados.contas || []).filter(c => cabe(c.titularidade));
  const cartoes = (dados.cartoes || []).filter(c => cabe(c.titularidade));
  const aplicacoes = (dados.aplicacoes || []).filter(a => cabe(a.titularidade));
  const contratos = (dados.contratos || []).filter(c => cabe(c.titularidade));

  const emConta = contas.reduce((s, c) => s + saldoDaConta(c, dados.lancamentos), 0);
  const aplicado = aplicacoes.reduce((s, a) => s + saldoAplicacao(a), 0);
  // a fatura que esta ABERTA em cada cartao, pelo ciclo de fechamento
  const faturaAberta = totalFaturasAbertas(cartoes, dados.lancamentos);
  const divida = contratos.reduce((s, c) => s + resumoContrato(c).saldoDevedor, 0);
  const liquido = emConta + aplicado - faturaAberta - divida;

  /* Cada banco vira um bloco, com as contas, aplicacoes e contratos
     que estao dentro dele. */
  const bancos = useMemo(() => {
    const mapa = {};
    const poe = (chave, banco, titular) => {
      if (!mapa[chave]) mapa[chave] = { chave: chave, banco: banco, titularidade: titular, contas: [], cartoes: [], aplicacoes: [], contratos: [] };
      return mapa[chave];
    };
    const chaveDe = (x) => (x.titularidade || "PF") + "|" + ((x.banco || "").trim() || "Sem banco");
    contas.forEach(c => poe(chaveDe(c), (c.banco || "").trim() || "Sem banco", c.titularidade || "PF").contas.push(c));
    cartoes.forEach(c => poe(chaveDe(c), (c.banco || "").trim() || "Sem banco", c.titularidade || "PF").cartoes.push(c));
    aplicacoes.forEach(a => poe(chaveDe(a), (a.banco || "").trim() || "Sem banco", a.titularidade || "PF").aplicacoes.push(a));
    contratos.forEach(c => poe(chaveDe(c), (c.banco || "").trim() || "Sem banco", c.titularidade || "PF").contratos.push(c));
    return Object.keys(mapa).sort().map(k => mapa[k]);
  }, [contas, cartoes, aplicacoes, contratos, dados.lancamentos]);

  if (aberta) {
    return <ExtratoDaConta conta={aberta} dados={dados} onVoltar={() => setAberta(null)} />;
  }
  if (cartaoAberto) {
    return <FaturaCartao cartao={cartaoAberto} dados={dados} mes={mes} onVoltar={() => setCartaoAberto(null)} />;
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-base font-bold">Bancos</h2>
        <FiltroTitular valor={filtro} onValor={setFiltro} />
      </div>

      <div className="grade-totais" style={{ background: "var(--borda)", border: "1px solid var(--borda)" }}>
        <StatCard label={"Em conta" + (filtro === "TUDO" ? "" : " · " + filtro)} valor={currency(emConta)} icone={IconBank} tom={emConta >= 0 ? "ok" : "perigo"} />
        <StatCard label="Aplicado" valor={currency(aplicado)} icone={IconCofre} />
        <StatCard label="Faturas abertas" valor={currency(faturaAberta)} icone={IconCard}
                  rodape="o que já entrou no ciclo atual de cada cartão" />
        <StatCard label="Dívida (contratos)" valor={currency(divida)} icone={IconContrato} tom={divida > 0 ? "perigo" : "neutro"} />
      </div>
      <Cartao className="p-3">
        <div className="flex items-baseline justify-between">
          <span className="text-[11px] uppercase tracking-wider" style={{ color: "var(--suave)" }}>
            Situação líquida {filtro === "TUDO" ? "geral" : "de " + filtro}
          </span>
          <span className="text-xl font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: liquido >= 0 ? "var(--ok-claro)" : "var(--erro-claro)" }}>
            {currency(liquido)}
          </span>
        </div>
        <div className="text-[11px] mt-1" style={{ color: "var(--suave)" }}>
          em conta + aplicado − fatura aberta − saldo devedor dos contratos
        </div>
      </Cartao>

      {bancos.length === 0 ? (
        <Cartao><Vazio texto="Nenhuma conta cadastrada ainda. Vá em Ajustes → Contas." /></Cartao>
      ) : bancos.map(b => (
        <Cartao key={b.chave} className="p-4">
          <div className="flex items-center gap-2 mb-3">
            <IconBank size={16} style={{ color: "var(--acento-vivo)" }} />
            <h3 className="text-sm font-bold">{b.banco}</h3>
            <ChipTitular valor={b.titularidade} />
          </div>

          {b.contas.map(c => {
            const saldo = saldoDaConta(c, dados.lancamentos);
            const cob = coberturaDaConta(c.id, dados.coberturas);
            const furos = furosDaConta(c.id, dados.coberturas);
            return (
              <div key={c.id} className="py-2" style={{ borderTop: "1px solid var(--linha)" }}>
                <div className="flex items-baseline justify-between gap-2 flex-wrap">
                  <div>
                    <span className="text-[13px] font-semibold">{c.nome || "(sem nome)"}</span>
                    <span className="text-[11px] ml-2" style={{ color: "var(--suave)" }}>{c.codigo}</span>
                  </div>
                  <span className="text-[15px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: saldo >= 0 ? "var(--texto)" : "var(--erro-claro)" }}>
                    {currency(saldo)}
                  </span>
                </div>
                <div className="flex items-center gap-2 flex-wrap mt-1">
                  <span className="text-[11px]" style={{ color: "var(--suave)" }}>
                    {cob ? "extrato de " + dataCurta(cob.de) + " a " + dataCurta(cob.ate) + " (" + cob.quantos + " arquivo(s))" : "nenhum extrato importado"}
                  </span>
                  <button className="text-[11px] underline no-print" style={{ color: "var(--acento-vivo)" }}
                          onClick={() => setAberta(c)}>ver extrato</button>
                </div>
                {furos.length ? (
                  <div className="mt-1.5">
                    <Faixa tom="erro">
                      Extrato parcial nesta conta: falta o período{furos.length > 1 ? "s" : ""}{" "}
                      {furos.map(f => dataCurta(f.de) + " a " + dataCurta(f.ate)).join(", ")}.
                      Mande o extrato desse pedaço para fechar a conta.
                    </Faixa>
                  </div>
                ) : null}
              </div>
            );
          })}

          {b.cartoes.map(k => {
            const f = faturaDoCartao(k, dados.lancamentos, mesFaturaAberta(k));
            return (
              <div key={k.id} className="py-2" style={{ borderTop: "1px solid var(--linha)" }}>
                <div className="flex items-baseline justify-between gap-2 flex-wrap">
                  <div>
                    <span className="text-[13px] font-semibold inline-flex items-center gap-1.5"><IconCard size={13} /> {k.nome || "(sem nome)"}</span>
                    <span className="text-[11px] ml-2" style={{ color: "var(--suave)" }}>{k.codigo}</span>
                  </div>
                  <span className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(f.total)}</span>
                </div>
                <div className="flex items-center gap-2 flex-wrap mt-1">
                  <span className="text-[11px]" style={{ color: "var(--suave)" }}>
                    fatura aberta {dataCurta(f.inicio)} a {dataCurta(f.fim)} · fecha {dataCurta(f.fim)}, vence {dataCurta(f.vencimento)} · {f.compras.length} compra(s)
                  </span>
                  <button className="text-[11px] underline no-print" style={{ color: "var(--acento-vivo)" }}
                          onClick={() => setCartaoAberto(k)}>ver fatura</button>
                </div>
              </div>
            );
          })}

          {b.aplicacoes.map(a => {
            const v = variacaoAplicacao(a);
            return (
              <div key={a.id} className="py-2 flex items-baseline justify-between gap-2 flex-wrap" style={{ borderTop: "1px solid var(--linha)" }}>
                <div>
                  <span className="text-[13px] font-semibold inline-flex items-center gap-1.5"><IconCofre size={13} /> {a.nome || "(sem nome)"}</span>
                  <span className="text-[11px] ml-2" style={{ color: "var(--suave)" }}>
                    {a.tipo || "aplicação"} · saldo de {dataSaldoAplicacao(a) ? dataCurta(dataSaldoAplicacao(a)) : "—"}
                    {v ? " · " + (v.valor >= 0 ? "+" : "") + currency(v.valor) + (v.pct == null ? "" : " (" + (v.pct >= 0 ? "+" : "") + v.pct.toFixed(2) + "%)") : ""}
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(saldoAplicacao(a))}</span>
                  <button className="text-[11px] underline no-print" style={{ color: "var(--acento-vivo)" }}
                          onClick={() => setNovaApl(a)}>atualizar</button>
                </div>
              </div>
            );
          })}

          {b.contratos.map(c => {
            const r = resumoContrato(c);
            return (
              <div key={c.id} className="py-2 flex items-baseline justify-between gap-2 flex-wrap" style={{ borderTop: "1px solid var(--linha)" }}>
                <div>
                  <span className="text-[13px] font-semibold inline-flex items-center gap-1.5"><IconContrato size={13} /> {c.descricao || "(contrato)"}</span>
                  <span className="text-[11px] ml-2" style={{ color: "var(--suave)" }}>
                    {r.pagas} de {r.total} pagas · faltam {r.faltam}
                    {r.vencidas ? " · " + r.vencidas + " vencida(s)" : ""}
                  </span>
                </div>
                <span className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--erro-claro)" }}>
                  {currency(r.saldoDevedor)}
                </span>
              </div>
            );
          })}
        </Cartao>
      ))}

      {novaApl ? (
        <ModalAtualizarAplicacao aplicacao={novaApl} onClose={() => setNovaApl(null)}
          onSalvar={(data, valor) => {
            alterar(d => Object.assign({}, d, {
              aplicacoes: (d.aplicacoes || []).map(a => a.id === novaApl.id
                ? Object.assign({}, a, { historico: (a.historico || []).filter(h => h.data !== data).concat([{ data: data, valor: valor, origem: "manual" }]) })
                : a)
            }));
            setNovaApl(null);
          }} />
      ) : null}
    </div>
  );
}

function ModalAtualizarAplicacao({ aplicacao, onSalvar, onClose }) {
  const [data, setData] = useState(dataHojeISO());
  const [valor, setValor] = useState("");
  return (
    <Modal titulo={"Saldo de " + (aplicacao.nome || "aplicação")} onClose={onClose} largura={420}>
      <div className="space-y-3">
        <p className="text-[12px]" style={{ color: "var(--suave)" }}>
          Na v3 isso vem do print da tela do banco, lido pela IA. Por enquanto, o número na mão.
        </p>
        <div className="grade-form">
          <Campo label="Data do saldo"><Entrada type="date" value={data} onChange={(e) => setData(e.target.value)} /></Campo>
          <Campo label="Saldo (R$)"><Entrada inputMode="decimal" value={valor} onChange={(e) => setValor(e.target.value)} placeholder="0,00" /></Campo>
        </div>
        <div className="flex gap-2">
          <Botao tom="acento" disabled={!paraNumero(valor)} onClick={() => onSalvar(data, paraNumero(valor))}>
            <IconCheck size={15} /> Guardar
          </Botao>
          <Botao tom="neutro" onClick={onClose}>Cancelar</Botao>
        </div>
        {(aplicacao.historico || []).length ? (
          <div className="pt-2">
            <div className="text-[11px] uppercase tracking-wide mb-1" style={{ color: "var(--suave)" }}>Histórico</div>
            {(aplicacao.historico || []).slice().sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 8).map(h => (
              <div key={h.data} className="flex justify-between text-[12px] py-0.5">
                <span style={{ color: "var(--suave)" }}>{dataCurta(h.data)}</span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(h.valor)}</span>
              </div>
            ))}
          </div>
        ) : null}
      </div>
    </Modal>
  );
}

/* ===========================================================
   EXTRATO DE UMA CONTA — com o saldo em cada linha
=========================================================== */
function ExtratoDaConta({ conta, dados, onVoltar }) {
  const catPorId = indexarPorId(dados.categorias);
  const linhas = extratoDaConta(conta, dados.lancamentos).slice().reverse();
  const furos = furosDaConta(conta.id, dados.coberturas);
  const cobs = (dados.coberturas || []).filter(c => c.contaId === conta.id)
    .sort((a, b) => String(b.ini).localeCompare(String(a.ini)));

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2 flex-wrap">
        <Botao tom="neutro" onClick={onVoltar} className="no-print">‹ Bancos</Botao>
        <h2 className="text-base font-bold">{conta.nome}</h2>
        <ChipTitular valor={conta.titularidade} />
        <span className="text-[12px]" style={{ color: "var(--suave)" }}>{conta.banco} · {conta.codigo}</span>
        <span className="ml-auto text-lg font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
          {currency(saldoDaConta(conta, dados.lancamentos))}
        </span>
      </div>

      {furos.length ? (
        <Faixa tom="erro">
          Extrato parcial: falta o período {furos.map(f => dataCurta(f.de) + " a " + dataCurta(f.ate)).join(", ")}.
          O saldo das linhas anteriores a esse furo não é confiável enquanto o pedaço não entrar.
        </Faixa>
      ) : null}

      {cobs.length ? (
        <Cartao className="p-3">
          <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--suave)" }}>Extratos importados</div>
          {cobs.map(c => {
            const conf = conferirCobertura(c);
            return (
              <div key={c.id} className="py-1.5 text-[12px]" style={{ borderTop: "1px solid var(--linha)" }}>
                <div className="flex justify-between gap-2 flex-wrap">
                  <span>{dataCurta(c.ini)} a {dataCurta(c.fim)} · {c.arquivo || "arquivo"}</span>
                  <span style={{ color: conf.completo === false ? "var(--erro-claro)" : conf.completo ? "var(--ok-claro)" : "var(--suave)" }}>
                    {conf.completo === false ? "parcial" : conf.completo ? "completo" : "sem saldo final"}
                  </span>
                </div>
                <div style={{ color: "var(--suave)" }}>{conf.texto}</div>
              </div>
            );
          })}
        </Cartao>
      ) : null}

      {linhas.length === 0 ? (
        <Cartao><Vazio texto="Nenhum lançamento nesta conta ainda." /></Cartao>
      ) : (
        <Cartao className="overflow-hidden">
          <div className="rolagem-resp" style={{ overflowX: "auto" }}>
            <table className="tab-resp w-full text-[13px]">
              <thead>
                <tr style={{ background: "var(--barra)", color: "var(--na-barra-suave)" }}>
                  <th className="text-left font-semibold px-3 py-2">Data</th>
                  <th className="text-left font-semibold px-3 py-2">Histórico</th>
                  <th className="text-left font-semibold px-3 py-2">Categoria</th>
                  <th className="text-right font-semibold px-3 py-2">Valor</th>
                  <th className="text-right font-semibold px-3 py-2">Saldo</th>
                </tr>
              </thead>
              <tbody>
                {linhas.map(l => {
                  const cat = catPorId[l.categoria];
                  const receita = (l.tipo || "despesa") === "receita";
                  return (
                    <tr key={l.id} style={{ borderTop: "1px solid var(--linha)" }}>
                      <td className="px-3 py-2" data-rot="Data" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{dataCurta(l.data)}</td>
                      <td className="px-3 py-2" data-rot="Histórico">
                        <div className="font-semibold">{l.estabelecimento || l.descricao || "(sem nome)"}</div>
                        <div className="text-[11px]" style={{ color: "var(--suave)" }}>
                          {l.origem === "extrato" ? "veio do extrato" : l.origem === "fatura" ? "veio da fatura" : l.origem === "foto" ? "veio da foto" : "digitado"}
                        </div>
                      </td>
                      <td className="px-3 py-2" data-rot="Categoria">{(cat && cat.nome) || "Sem categoria"}</td>
                      <td className="px-3 py-2 text-right" data-rot="Valor"
                          style={{ fontFamily: "'JetBrains Mono', monospace", color: receita ? "var(--ok-claro)" : "var(--texto)" }}>
                        {receita ? "+" : "−"} {currency(l.valor)}
                      </td>
                      <td className="px-3 py-2 text-right" data-rot="Saldo"
                          style={{ fontFamily: "'JetBrains Mono', monospace", color: l.saldo >= 0 ? "var(--suave)" : "var(--erro-claro)" }}>
                        {currency(l.saldo)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Cartao>
      )}
    </div>
  );
}

/* ===========================================================
   FATURA DE UM CARTAO — pelo ciclo de fechamento, com as
   compras daquele periodo e o total que vai ser cobrado.
=========================================================== */
function FaturaCartao({ cartao, dados, mes, onVoltar }) {
  // abre na fatura ABERTA, nao na que vence no mes corrente
  const [mesFatura, setMesFatura] = useState(() => mesFaturaAberta(cartao));
  const catPorId = indexarPorId(dados.categorias);
  const contaPorId = indexarPorId(dados.contas);
  const f = faturaDoCartao(cartao, dados.lancamentos, mesFatura);
  const contaDebito = contaPorId[cartao.contaDebitoId];
  const limite = Number(cartao.limite) || 0;
  const usado = limite ? Math.min(100, (f.total / limite) * 100) : 0;
  /* Sem isto da para olhar uma fatura ja paga achando que e a do mes.
     A fatura que esta recebendo compras hoje quase nunca e a que
     vence no mes corrente. */
  const hoje = dataHojeISO();
  const estado = hoje > f.fim ? "fechada" : (hoje >= f.inicio ? "aberta" : "futura");

  return (
    <div className="space-y-4">
      <div className="flex items-center gap-2 flex-wrap">
        <Botao tom="neutro" onClick={onVoltar} className="no-print">‹ Bancos</Botao>
        <h2 className="text-base font-bold inline-flex items-center gap-1.5"><IconCard size={16} /> {cartao.nome}</h2>
        <ChipTitular valor={cartao.titularidade} />
        <span className="text-[12px]" style={{ color: "var(--suave)" }}>{cartao.banco} · {cartao.codigo}</span>
        <div className="ml-auto no-print"><SeletorMes mes={mesFatura} onMes={setMesFatura} /></div>
      </div>

      <div className="grade-totais" style={{ background: "var(--borda)", border: "1px solid var(--borda)" }}>
        <StatCard label="Total da fatura" valor={currency(f.total)} icone={IconCard} tom={f.total > 0 ? "perigo" : "neutro"} />
        <StatCard label="Período" valor={dataCurta(f.inicio) + " a " + dataCurta(f.fim)} rodape={"fecha dia " + cartao.diaFechamento} />
        <StatCard label="Vencimento" valor={dataCurta(f.vencimento)} rodape={contaDebito ? "debita em " + contaDebito.nome : "sem conta ligada"} />
        <StatCard label="Compras" valor={String(f.compras.length)} rodape={limite ? "limite " + currency(limite) : "sem limite cadastrado"} />
      </div>

      <Faixa tom="aviso">
        {estado === "aberta"
          ? "Fatura ABERTA: ainda entram compras até " + dataCurta(f.fim) + ", quando ela fecha."
          : estado === "fechada"
          ? "Fatura FECHADA em " + dataCurta(f.fim) + ". As compras de hoje vão para uma fatura seguinte."
          : "Fatura FUTURA: começa a receber compras em " + dataCurta(f.inicio) + "."}
      </Faixa>

      {limite ? (
        <Cartao className="p-3">
          <div className="flex items-baseline justify-between text-[12px]">
            <span style={{ color: "var(--suave)" }}>uso do limite nesta fatura</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{usado.toFixed(0)}%</span>
          </div>
          <div className="h-1.5 rounded mt-1.5" style={{ background: "var(--linha)" }}>
            <div className="h-1.5 rounded" style={{ width: usado + "%", background: usado > 80 ? "var(--perigo)" : "var(--acento)" }} />
          </div>
        </Cartao>
      ) : null}

      {f.compras.length === 0 ? (
        <Cartao><Vazio texto="Nenhuma compra nesta fatura." /></Cartao>
      ) : (
        <Cartao className="overflow-hidden">
          <div className="rolagem-resp" style={{ overflowX: "auto" }}>
            <table className="tab-resp w-full text-[13px]">
              <thead>
                <tr style={{ background: "var(--barra)", color: "var(--na-barra-suave)" }}>
                  <th className="text-left font-semibold px-3 py-2">Data</th>
                  <th className="text-left font-semibold px-3 py-2">Estabelecimento</th>
                  <th className="text-left font-semibold px-3 py-2">Categoria</th>
                  <th className="text-right font-semibold px-3 py-2">Valor</th>
                </tr>
              </thead>
              <tbody>
                {f.compras.map(l => {
                  const cat = catPorId[l.categoria];
                  return (
                    <tr key={l.id} style={{ borderTop: "1px solid var(--linha)" }}>
                      <td className="px-3 py-2" data-rot="Data" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{dataCurta(l.data)}</td>
                      <td className="px-3 py-2" data-rot="Estabelecimento">
                        <div className="font-semibold">{l.estabelecimento || l.descricao || "(sem nome)"}</div>
                        <div className="text-[11px]" style={{ color: "var(--suave)" }}>
                          {l.origem === "fatura" ? "veio da fatura" : l.origem === "foto" ? "veio da foto" : "digitado"}
                        </div>
                      </td>
                      <td className="px-3 py-2" data-rot="Categoria">
                        <span className="inline-flex items-center gap-1.5">
                          <MarcaCategoria categoria={cat} size={15} />
                          {(cat && cat.nome) || "Sem categoria"}
                        </span>
                      </td>
                      <td className="px-3 py-2 text-right" data-rot="Valor" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(l.valor)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Cartao>
      )}
    </div>
  );
}


/* ===========================================================
   ABA CONTRATOS — financiamento, emprestimo, consorcio.
   Quantas parcelas faltam, quanto ja foi pago, o prazo, a taxa
   e o comeco e o fim — dentro do banco de cada um.
=========================================================== */
const TIPOS_CONTRATO = [
  { id: "financiamento", rotulo: "Financiamento" },
  { id: "emprestimo",    rotulo: "Empréstimo" },
  { id: "consorcio",     rotulo: "Consórcio" },
  { id: "leasing",       rotulo: "Leasing" }
];

function AbaContratos({ dados, alterar }) {
  const [filtro, setFiltro] = useState("TUDO");
  const [editando, setEditando] = useState(null);
  const [aberto, setAberto] = useState(null);

  const cabe = (t) => filtro === "TUDO" || (t || "PF") === filtro;
  const lista = (dados.contratos || []).filter(c => cabe(c.titularidade));

  const salvar = (c) => {
    const g = gerarParcelas(c, c.parcelas);
    const pronto = Object.assign({}, c, { parcelas: g.parcelas, taxaMes: g.taxaUsada, valorParcela: Math.round(g.parcelaUsada * 100) / 100 });
    alterar(d => {
      const existe = (d.contratos || []).some(x => x.id === pronto.id);
      return Object.assign({}, d, {
        contratos: existe ? d.contratos.map(x => x.id === pronto.id ? pronto : x) : (d.contratos || []).concat([pronto])
      });
    });
    setEditando(null);
    setAberto(pronto.id);
  };

  const baixarParcela = (contratoId, n, marcado, quando, quanto) =>
    alterar(d => Object.assign({}, d, {
      contratos: (d.contratos || []).map(c => c.id !== contratoId ? c : Object.assign({}, c, {
        parcelas: (c.parcelas || []).map(p => p.n !== n ? p : Object.assign({}, p, {
          pago: marcado, dataPagamento: marcado ? (quando || dataHojeISO()) : "", valorPago: marcado ? (quanto || p.valor) : 0
        }))
      }))
    }));

  const contratoAberto = lista.filter(c => c.id === aberto)[0] || null;

  /* O modal precisa existir nas DUAS telas — na lista e dentro do
     contrato aberto. Deixar so na lista fazia o botao Editar do
     painel nao abrir nada. */
  const modal = editando
    ? <ModalContrato inicial={editando} dados={dados} onSalvar={salvar} onClose={() => setEditando(null)} />
    : null;

  if (contratoAberto) {
    return (
      <>
        <PainelContrato contrato={contratoAberto} dados={dados}
          onVoltar={() => setAberto(null)} onEditar={() => setEditando(contratoAberto)}
          onBaixar={baixarParcela}
          onExcluir={() => { alterar(d => Object.assign({}, d, { contratos: (d.contratos || []).filter(x => x.id !== contratoAberto.id) })); setAberto(null); }} />
        {modal}
      </>
    );
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-base font-bold">Contratos</h2>
        <div className="flex items-center gap-2 flex-wrap no-print">
          <FiltroTitular valor={filtro} onValor={setFiltro} />
          <Botao tom="acento" onClick={() => setEditando({ id: uid(), titularidade: filtro === "PJ" ? "PJ" : "PF" })}>
            <IconPlus size={15} /> Novo
          </Botao>
        </div>
      </div>

      {lista.length === 0 ? (
        <Cartao><Vazio texto="Nenhum contrato cadastrado. Cadastre o financiamento e o app monta a tabela de parcelas sozinho." /></Cartao>
      ) : lista.map(c => {
        const r = resumoContrato(c);
        const pct = r.total ? (r.pagas / r.total) * 100 : 0;
        return (
          <Cartao key={c.id} className="p-4">
            <div className="flex items-start justify-between gap-2 flex-wrap">
              <div>
                <div className="flex items-center gap-2">
                  <IconContrato size={15} style={{ color: "var(--acento-vivo)" }} />
                  <h3 className="text-sm font-bold">{c.descricao || "(contrato)"}</h3>
                  <ChipTitular valor={c.titularidade} />
                </div>
                <div className="text-[12px] mt-0.5" style={{ color: "var(--suave)" }}>
                  {c.banco || "sem banco"} · {(TIPOS_CONTRATO.filter(t => t.id === c.tipo)[0] || {}).rotulo || "contrato"}
                </div>
              </div>
              <button className="text-[12px] underline no-print" style={{ color: "var(--acento-vivo)" }}
                      onClick={() => setAberto(c.id)}>abrir</button>
            </div>

            <div className="h-1.5 rounded mt-3" style={{ background: "var(--linha)" }}>
              <div className="h-1.5 rounded" style={{ width: pct + "%", background: "var(--acento)" }} />
            </div>

            <div className="grade-form-2 mt-3">
              <div>
                <div className="text-[10px] uppercase tracking-wider" style={{ color: "var(--suave)" }}>Parcelas</div>
                <div className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                  {r.pagas} pagas · faltam {r.faltam}
                </div>
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-wider" style={{ color: "var(--suave)" }}>Já pago</div>
                <div className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--ok-claro)" }}>{currency(r.totalPago)}</div>
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-wider" style={{ color: "var(--suave)" }}>Saldo devedor</div>
                <div className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--erro-claro)" }}>{currency(r.saldoDevedor)}</div>
              </div>
            </div>

            <div className="text-[12px] mt-2" style={{ color: "var(--suave)" }}>
              prazo {r.total} meses · {dataCurta(r.inicio)} a {dataCurta(r.fim)} ·
              taxa {r.taxaMes.toFixed(4).replace(".", ",")}% a.m. ({r.taxaAno.toFixed(2).replace(".", ",")}% a.a.)
              {r.proxima ? " · próxima em " + dataCurta(r.proxima.vencimento) + " de " + currency(r.proxima.valor) : " · quitado"}
            </div>
            {r.vencidas ? <div className="mt-2"><Faixa tom="erro">{r.vencidas} parcela(s) vencida(s) sem baixa.</Faixa></div> : null}
          </Cartao>
        );
      })}

      {modal}
    </div>
  );
}

function ModalContrato({ inicial, dados, onSalvar, onClose }) {
  const b = inicial || {};
  const [titularidade, setTitularidade] = useState(b.titularidade || "PF");
  const [descricao, setDescricao] = useState(b.descricao || "");
  const [banco, setBanco] = useState(b.banco || "");
  const [tipo, setTipo] = useState(b.tipo || "financiamento");
  const [contaId, setContaId] = useState(b.contaId || "");
  const [valorFinanciado, setValor] = useState(b.valorFinanciado ? String(b.valorFinanciado).replace(".", ",") : "");
  const [prazoMeses, setPrazo] = useState(b.prazoMeses ? String(b.prazoMeses) : "");
  const [taxaMes, setTaxa] = useState(b.taxaMes ? String(b.taxaMes).replace(".", ",") : "");
  const [valorParcela, setParcela] = useState(b.valorParcela ? String(b.valorParcela).replace(".", ",") : "");
  const [dataInicio, setInicio] = useState(b.dataInicio || dataHojeISO());
  const [diaVencimento, setDia] = useState(String(b.diaVencimento || 10));
  const [avisos, setAvisos] = useState([]);

  const montar = () => ({
    id: b.id || uid(), titularidade: titularidade, descricao: descricao.trim(), banco: banco.trim(),
    tipo: tipo, contaId: contaId, valorFinanciado: paraNumero(valorFinanciado),
    prazoMeses: Number(prazoMeses) || 0, taxaMes: paraNumero(taxaMes),
    valorParcela: paraNumero(valorParcela), dataInicio: dataInicio,
    diaVencimento: Number(diaVencimento) || 0, parcelas: b.parcelas || []
  });

  const previa = useMemo(() => {
    const c = montar();
    if (!c.valorFinanciado || !c.prazoMeses) return null;
    const g = gerarParcelas(c, []);
    return { taxa: g.taxaUsada, parcela: g.parcelaUsada, total: g.parcelas.reduce((s, p) => s + p.valor, 0), fim: g.parcelas.length ? g.parcelas[g.parcelas.length - 1].vencimento : "" };
  }, [valorFinanciado, prazoMeses, taxaMes, valorParcela, dataInicio, diaVencimento]);

  const tentar = () => {
    const c = montar();
    const e = [];
    if (!c.descricao) e.push("Dê um nome ao contrato (ex.: Financiamento do Hilux).");
    if (!c.valorFinanciado) e.push("Falta o valor financiado.");
    if (!c.prazoMeses) e.push("Falta o prazo em meses.");
    if (!c.taxaMes && !c.valorParcela) e.push("Informe a taxa ao mês OU o valor da parcela — o app descobre a outra.");
    if (e.length) { setAvisos(e); return; }
    onSalvar(c);
  };

  return (
    <Modal titulo={b.descricao ? "Editar contrato" : "Novo contrato"} onClose={onClose} largura={620}>
      <div className="space-y-3">
        <div className="flex gap-2">
          {TITULARIDADES.map(t => (
            <button key={t.id} onClick={() => setTitularidade(t.id)} className="flex-1 py-2 rounded-md text-sm font-semibold"
              style={{ background: titularidade === t.id ? "var(--selecionado-bg)" : "var(--superficie)",
                       color: titularidade === t.id ? "var(--selecionado-txt)" : "var(--texto)",
                       border: "1px solid " + (titularidade === t.id ? "var(--selecionado-bg)" : "var(--borda)") }}>
              {t.rotulo}
            </button>
          ))}
        </div>

        <Campo label="Nome do contrato"><Entrada value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Ex.: Financiamento do caminhão" /></Campo>

        <div className="grade-form">
          <Campo label="Banco"><Entrada value={banco} onChange={(e) => setBanco(e.target.value)} placeholder="Ex.: Itaú" /></Campo>
          <Campo label="Tipo">
            <Selecao value={tipo} onChange={(e) => setTipo(e.target.value)}>
              {TIPOS_CONTRATO.map(t => <option key={t.id} value={t.id}>{t.rotulo}</option>)}
            </Selecao>
          </Campo>
        </div>

        <Campo label="Debita na conta">
          <Selecao value={contaId} onChange={(e) => setContaId(e.target.value)}>
            <option value="">— nenhuma —</option>
            {(dados.contas || []).filter(c => (c.titularidade || "PF") === titularidade).map(c => (
              <option key={c.id} value={c.id}>{c.nome || "(sem nome)"} · {c.banco}</option>
            ))}
          </Selecao>
        </Campo>

        <div className="grade-form-2">
          <Campo label="Valor financiado (R$)"><Entrada inputMode="decimal" value={valorFinanciado} onChange={(e) => setValor(e.target.value)} placeholder="0,00" /></Campo>
          <Campo label="Prazo (meses)"><Entrada type="number" min="1" value={prazoMeses} onChange={(e) => setPrazo(e.target.value)} placeholder="60" /></Campo>
          <Campo label="1ª parcela vence em"><Entrada type="date" value={dataInicio} onChange={(e) => setInicio(e.target.value)} /></Campo>
        </div>

        <div className="grade-form-2">
          <Campo label="Taxa (% ao mês)" dica="Deixe em branco se souber a parcela."><Entrada inputMode="decimal" value={taxaMes} onChange={(e) => setTaxa(e.target.value)} placeholder="1,29" /></Campo>
          <Campo label="Valor da parcela (R$)" dica="Deixe em branco se souber a taxa."><Entrada inputMode="decimal" value={valorParcela} onChange={(e) => setParcela(e.target.value)} placeholder="0,00" /></Campo>
          <Campo label="Dia do vencimento"><Entrada type="number" min="1" max="31" value={diaVencimento} onChange={(e) => setDia(e.target.value)} /></Campo>
        </div>

        {previa ? (
          <Cartao className="p-3">
            <div className="text-[11px] uppercase tracking-wide mb-1" style={{ color: "var(--suave)" }}>Como vai ficar</div>
            <div className="text-[13px]">
              parcela de <b style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(previa.parcela)}</b> ·
              taxa <b>{previa.taxa.toFixed(4).replace(".", ",")}% a.m.</b> ·
              total <b style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(previa.total)}</b> ·
              última em <b>{dataCurta(previa.fim)}</b>
            </div>
          </Cartao>
        ) : null}

        {avisos.length ? <Faixa tom="erro">{avisos.map((a, i) => <div key={i}>{a}</div>)}</Faixa> : null}

        <div className="flex gap-2">
          <Botao tom="acento" onClick={tentar}><IconCheck size={15} /> Salvar e montar as parcelas</Botao>
          <Botao tom="neutro" onClick={onClose}>Cancelar</Botao>
        </div>
      </div>
    </Modal>
  );
}

/* ===========================================================
   ABA GRAFICOS
   Regras seguidas aqui, de proposito:
   - a forma vem do trabalho do dado: comparar tamanho entre
     nomes = barra horizontal ordenada; mudanca no tempo = barra
     por mes. Nada de pizza, nada de dois eixos.
   - cor de serie e so das DUAS series (entrou/saiu), e essas
     duas foram validadas para daltonismo e contraste. As barras
     de categoria carregam o nome escrito ao lado, entao a
     identidade nunca depende da cor.
   - no maximo 8 categorias no grafico; da nona em diante vira
     "Outras". Cor de serie nao se inventa nem se repete.
   - todo grafico tem o "ver números" com a tabela do lado.
=========================================================== */

function curtoBRL(n) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  if (abs >= 1000000) return "R$ " + (v / 1000000).toFixed(1).replace(".", ",") + " mi";
  if (abs >= 1000) return "R$ " + (v / 1000).toFixed(1).replace(".", ",") + " mil";
  return "R$ " + v.toFixed(0);
}

/* Dica que segue o dedo/mouse. Um grafico em tela e interativo:
   sem isso o valor exato de cada barra fica adivinhado. */
function useDica() {
  const [dica, setDica] = useState(null);
  const caixaRef = useRef(null);
  const mostrar = (ev, conteudo) => {
    const caixa = caixaRef.current;
    if (!caixa) return;
    const r = caixa.getBoundingClientRect();
    const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    setDica({ x: Math.min(Math.max(cx, 70), r.width - 70), y: Math.max(cy - 12, 8), conteudo: conteudo });
  };
  const esconder = () => setDica(null);
  const elemento = dica ? (
    <div className="no-print" style={{
      position: "absolute", left: dica.x, top: dica.y, transform: "translate(-50%,-100%)",
      background: "var(--barra)", border: "1px solid var(--borda)", borderRadius: 6,
      padding: "6px 9px", fontSize: 12, whiteSpace: "nowrap", pointerEvents: "none", zIndex: 5,
      boxShadow: "0 4px 14px rgba(0,0,0,.5)"
    }}>{dica.conteudo}</div>
  ) : null;
  return { caixaRef, mostrar, esconder, elemento };
}

/* Barras horizontais ordenadas: o nome fica escrito na barra e o
   valor na ponta, entao da para ler sem consultar legenda. */
function BarrasHorizontais({ itens, vazio }) {
  const { caixaRef, mostrar, esconder, elemento } = useDica();
  const maior = itens.reduce((m, i) => Math.max(m, i.valor), 0);
  const total = itens.reduce((s, i) => s + i.valor, 0);
  if (!itens.length) return <Vazio texto={vazio} />;
  return (
    <div ref={caixaRef} style={{ position: "relative" }}>
      {elemento}
      <div className="space-y-2.5">
        {itens.map(i => {
          const pct = maior ? (i.valor / maior) * 100 : 0;
          const share = total ? (i.valor / total) * 100 : 0;
          return (
            <div key={i.id}
                 onMouseMove={(e) => mostrar(e, i.rotulo + " · " + currency(i.valor) + " · " + share.toFixed(1).replace(".", ",") + "% do total")}
                 onMouseLeave={esconder}
                 onTouchStart={(e) => mostrar(e, i.rotulo + " · " + currency(i.valor))}
                 onTouchEnd={esconder}>
              <div className="flex items-baseline justify-between gap-2 text-[13px]">
                <span className="font-semibold inline-flex items-center gap-1.5">
                  {i.marca}{i.rotulo}
                </span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(i.valor)}</span>
              </div>
              <div style={{ height: 10, background: "var(--linha)", borderRadius: 5, marginTop: 4 }}>
                <div className="barra-dado" style={{
                  width: Math.max(pct, 1.5) + "%", height: 10, borderRadius: 5,
                  background: i.cor, transition: "width .2s"
                }} />
              </div>
              <div className="text-[11px] mt-0.5" style={{ color: "var(--suave)" }}>
                {share.toFixed(1).replace(".", ",")}% do total{i.detalhe ? " · " + i.detalhe : ""}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Entrou e saiu, mes a mes. Duas series, um eixo so, legenda
   presente. Rola na horizontal no celular em vez de encolher a
   ponto de ninguem ler os rotulos. */
function GraficoMesAMes({ dadosMeses }) {
  const { caixaRef, mostrar, esconder, elemento } = useDica();
  /* No celular cabem uns seis meses. Abrir mostrando setembro do ano
     passado, que costuma estar vazio, e inutil — a tela abre no mes
     escolhido, que fica na ponta direita. */
  const rolagemRef = useRef(null);
  useEffect(() => {
    const el = rolagemRef.current;
    if (el) el.scrollLeft = el.scrollWidth;
  }, [dadosMeses]);
  const L = 52, R = 8, T = 12, B = 26;
  const larguraMes = 54;
  const W = L + R + dadosMeses.length * larguraMes;
  const H = 200;
  const alturaPlot = H - T - B;
  const maior = dadosMeses.reduce((m, d) => Math.max(m, d.entrou, d.saiu), 0) || 1;
  const y = (v) => T + alturaPlot - (v / maior) * alturaPlot;
  const marcas = [0, 0.5, 1].map(f => f * maior);

  return (
    <div ref={caixaRef} style={{ position: "relative" }}>
      {elemento}
      <div className="flex items-center gap-4 mb-2 text-[12px]">
        <span className="inline-flex items-center gap-1.5" style={{ color: "var(--serie-entrou)" }}>
          <IconTrendUp size={14} /> <span style={{ color: "var(--texto)" }}>Entrou</span>
        </span>
        <span className="inline-flex items-center gap-1.5" style={{ color: "var(--serie-saiu)" }}>
          <IconTrendDown size={14} /> <span style={{ color: "var(--texto)" }}>Saiu</span>
        </span>
      </div>
      <div ref={rolagemRef} style={{ overflowX: "auto" }}>
        <svg viewBox={"0 0 " + W + " " + H} width={W} height={H} style={{ maxWidth: "none" }} role="img"
             aria-label="Entrou e saiu por mês">
          {marcas.map((v, i) => (
            <g key={i}>
              <line x1={L} y1={y(v)} x2={W - R} y2={y(v)} stroke="var(--grade-eixo)" strokeWidth="1" />
              <text x={L - 6} y={y(v) + 3.5} textAnchor="end" fontSize="9" fill="var(--grade-texto)">{curtoBRL(v)}</text>
            </g>
          ))}
          {dadosMeses.map((d, i) => {
            const x0 = L + i * larguraMes;
            const larg = 17;
            const dica = d.rotuloLongo + " — entrou " + currency(d.entrou) + ", saiu " + currency(d.saiu);
            return (
              <g key={d.mes}
                 onMouseMove={(e) => mostrar(e, dica)} onMouseLeave={esconder}
                 onTouchStart={(e) => mostrar(e, dica)} onTouchEnd={esconder}>
                <rect x={x0 + 4} y={T} width={larguraMes - 8} height={alturaPlot} fill="transparent" />
                <rect className="barra-dado" x={x0 + 6} y={y(d.entrou)} width={larg}
                      height={Math.max(alturaPlot - (y(d.entrou) - T), 0)} rx="3" fill="var(--serie-entrou)" />
                <rect className="barra-dado" x={x0 + 6 + larg + 2} y={y(d.saiu)} width={larg}
                      height={Math.max(alturaPlot - (y(d.saiu) - T), 0)} rx="3" fill="var(--serie-saiu)" />
                <text x={x0 + larguraMes / 2} y={H - 9} textAnchor="middle" fontSize="9" fill="var(--grade-texto)">{d.rotulo}</text>
              </g>
            );
          })}
          <line x1={L} y1={T + alturaPlot} x2={W - R} y2={T + alturaPlot} stroke="var(--grade-eixo)" strokeWidth="1.5" />
        </svg>
      </div>
    </div>
  );
}

const MAX_FATIAS = 8; // da nona categoria em diante, vira "Outras"

/* "Cartão Cartão Nubank" fica feio: so prefixa quando o nome
   dado pelo usuario ainda nao diz que e cartao. */
function nomeDaOrigem(obj, ehCartao) {
  const nome = obj.nome || obj.codigo || "(sem nome)";
  if (!ehCartao) return nome;
  return /^cart[aã]o/i.test(nome.trim()) ? nome : "Cartão " + nome;
}

function AbaGraficos({ dados, mes, onMes }) {
  const [filtro, setFiltro] = useState("TUDO");
  const mapaContas = indexarPorId(dados.contas);
  const mapaCartoes = indexarPorId(dados.cartoes);
  const catPorId = indexarPorId(dados.categorias);
  const cabe = (l) => filtro === "TUDO" || titularidadeDoLancamento(l, mapaContas, mapaCartoes) === filtro;
  const todos = (dados.lancamentos || []).filter(cabe);

  const doMes = todos.filter(l => mesDaData(l.data) === mes);
  const despesasMes = doMes.filter(l => (l.tipo || "despesa") === "despesa");

  /* 1) Despesa por categoria, do mes escolhido */
  const porCategoria = useMemo(() => {
    const acc = {};
    despesasMes.forEach(l => {
      const k = l.categoria || "sem";
      acc[k] = (acc[k] || 0) + (Number(l.valor) || 0);
    });
    const lista = Object.keys(acc).map(k => ({
      id: k,
      rotulo: (catPorId[k] && catPorId[k].nome) || "Sem categoria",
      valor: acc[k],
      cor: (catPorId[k] && catPorId[k].cor) || "#7F8EA3",
      marca: <MarcaCategoria categoria={catPorId[k]} size={15} />
    })).sort((a, b) => b.valor - a.valor);
    if (lista.length <= MAX_FATIAS) return lista;
    const cabeca = lista.slice(0, MAX_FATIAS);
    const resto = lista.slice(MAX_FATIAS);
    cabeca.push({
      id: "outras", rotulo: "Outras (" + resto.length + ")",
      valor: resto.reduce((s, x) => s + x.valor, 0), cor: "#7F8EA3",
      marca: <span style={{ color: "#7F8EA3", display: "inline-flex" }}><IconeCategoria id="outros" size={15} /></span>
    });
    return cabeca;
  }, [despesasMes, catPorId]);

  /* 2) Entrou e saiu nos ultimos 12 meses */
  const mesesSerie = useMemo(() => {
    const out = [];
    for (let i = 11; i >= 0; i--) {
      const mm = mesSomado(mes, -i);
      const doMM = todos.filter(l => mesDaData(l.data) === mm);
      const entrou = doMM.filter(l => l.tipo === "receita").reduce((s, l) => s + (Number(l.valor) || 0), 0);
      const saiu = doMM.filter(l => (l.tipo || "despesa") === "despesa").reduce((s, l) => s + (Number(l.valor) || 0), 0);
      const [a, m] = mm.split("-");
      out.push({ mes: mm, rotulo: m + "/" + a.slice(2), rotuloLongo: mesPorExtenso(mm), entrou: entrou, saiu: saiu });
    }
    return out;
  }, [todos, mes]);

  /* 3) De onde o dinheiro saiu: por conta e por cartao */
  const porOrigem = useMemo(() => {
    const acc = {};
    despesasMes.forEach(l => {
      const chave = l.cartaoId ? "k:" + l.cartaoId : l.contaId ? "c:" + l.contaId : "dinheiro";
      acc[chave] = (acc[chave] || 0) + (Number(l.valor) || 0);
    });
    return Object.keys(acc).map(k => {
      if (k === "dinheiro") return { id: k, rotulo: "Dinheiro / sem conta", valor: acc[k], cor: "#7F8EA3", detalhe: "",
        marca: <span style={{ color: "#7F8EA3", display: "inline-flex" }}><IconWallet size={15} /></span> };
      const ehCartao = k.indexOf("k:") === 0;
      const obj = ehCartao ? mapaCartoes[k.slice(2)] : mapaContas[k.slice(2)];
      if (!obj) return { id: k, rotulo: "(removido)", valor: acc[k], cor: "#7F8EA3", detalhe: "",
        marca: <span style={{ color: "#7F8EA3", display: "inline-flex" }}><IconAlert size={15} /></span> };
      return {
        id: k,
        rotulo: nomeDaOrigem(obj, ehCartao),
        valor: acc[k],
        cor: ehCartao ? "var(--serie-saiu)" : "var(--serie-entrou)",
        marca: (
          <span style={{ color: ehCartao ? "var(--serie-saiu)" : "var(--serie-entrou)", display: "inline-flex" }}>
            {ehCartao ? <IconCard size={15} /> : <IconBank size={15} />}
          </span>
        ),
        detalhe: (obj.banco || "") + " · " + (obj.titularidade || "PF")
      };
    }).sort((a, b) => b.valor - a.valor);
  }, [despesasMes, mapaContas, mapaCartoes]);

  const totalSaiu = despesasMes.reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const totalEntrou = doMes.filter(l => l.tipo === "receita").reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const mediaSaiu = mesesSerie.filter(m => m.saiu > 0);
  const media = mediaSaiu.length ? mediaSaiu.reduce((s, m) => s + m.saiu, 0) / mediaSaiu.length : 0;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-base font-bold">Gráficos{filtro === "TUDO" ? "" : " · " + filtro}</h2>
        <div className="flex items-center gap-2 flex-wrap">
          <FiltroTitular valor={filtro} onValor={setFiltro} />
          <SeletorMes mes={mes} onMes={onMes} />
        </div>
      </div>

      <div className="grade-totais" style={{ background: "var(--borda)", border: "1px solid var(--borda)" }}>
        <StatCard label={"Saiu em " + mesPorExtenso(mes)} valor={currency(totalSaiu)} icone={IconTrendDown} tom="perigo"
                  rodape={media ? (totalSaiu > media ? "acima" : "abaixo") + " da média de " + currency(media) : "sem histórico"} />
        <StatCard label="Entrou" valor={currency(totalEntrou)} icone={IconTrendUp} tom="ok" />
        <StatCard label="Categorias com gasto" valor={String(porCategoria.length)} icone={IconTag} />
        <StatCard label="Maior categoria" valor={porCategoria.length ? porCategoria[0].rotulo : "—"} icone={IconTag}
                  rodape={porCategoria.length ? currency(porCategoria[0].valor) : ""} />
      </div>

      <BlocoGrafico titulo={"Despesas por categoria · " + mesPorExtenso(mes)} icone={IconTag}
        sub={porCategoria.length > MAX_FATIAS ? "As oito maiores; o resto está somado em “Outras”." : "Ordenado da maior para a menor."}
        numeros={{
          colunas: ["Categoria", "Valor", "% do mês"],
          linhas: porCategoria.map(c => [c.rotulo, currency(c.valor),
            (totalSaiu ? (c.valor / totalSaiu) * 100 : 0).toFixed(1).replace(".", ",") + "%"])
        }}>
        <BarrasHorizontais itens={porCategoria} vazio="Nenhuma despesa neste mês ainda." />
      </BlocoGrafico>

      <BlocoGrafico titulo="Entrou e saiu, mês a mês" icone={IconGrid}
        sub="Os doze meses até o mês escolhido. Mesma escala nas duas séries."
        numeros={{
          colunas: ["Mês", "Entrou", "Saiu", "Sobrou"],
          linhas: mesesSerie.map(m => [m.rotuloLongo, currency(m.entrou), currency(m.saiu), currency(m.entrou - m.saiu)])
        }}>
        <GraficoMesAMes dadosMeses={mesesSerie} />
      </BlocoGrafico>

      <BlocoGrafico titulo={"De onde o dinheiro saiu · " + mesPorExtenso(mes)} icone={IconBank}
        sub="Conta a conta e cartão a cartão."
        numeros={{
          colunas: ["Origem", "Valor", "% do mês"],
          linhas: porOrigem.map(o => [o.rotulo, currency(o.valor),
            (totalSaiu ? (o.valor / totalSaiu) * 100 : 0).toFixed(1).replace(".", ",") + "%"])
        }}>
        <BarrasHorizontais itens={porOrigem} vazio="Nenhuma despesa neste mês ainda." />
      </BlocoGrafico>
    </div>
  );
}


/* ===========================================================
   PROCURAR DUPLICADOS
   Pontuacao decide qual registro fica. Item que repete por
   natureza NUNCA vem pre-marcado.
=========================================================== */
function PainelDuplicados({ dados, onRemover }) {
  const grupos = useMemo(() => acharDuplicados(dados.lancamentos || [], dados.categorias || []), [dados.lancamentos, dados.categorias]);
  const [marcados, setMarcados] = useState(() => {
    const m = {};
    grupos.forEach(g => { if (g.preMarcar) g.itens.slice(1).forEach(i => { m[i.id] = true; }); });
    return m;
  });
  const total = Object.keys(marcados).filter(k => marcados[k]).length;

  if (!grupos.length) return <Vazio texto="Nenhum lançamento repetido encontrado." />;

  return (
    <div className="space-y-3">
      <Faixa tom="aviso">
        {grupos.length === 1 ? "1 grupo parecido" : grupos.length + " grupos parecidos"}.
        O primeiro de cada grupo é o mais completo e fica por padrão. Gasto que repete por natureza
        (mercado, combustível, refeição) não vem marcado — duas compras iguais no mesmo dia acontecem de verdade.
      </Faixa>
      {grupos.map(g => (
        <Cartao key={g.id} className="p-3">
          <div className="text-[11px] mb-2" style={{ color: "var(--suave)" }}>
            {g.forca >= 3 ? "Casamento certo (mesmo identificador do banco ou mesmo arquivo)"
              : g.forca >= 2 ? "Mesmo dia, mesmo valor, mesmo estabelecimento"
              : "Valor igual em dias próximos"}
            {g.repetitiva ? " · categoria que repete por natureza" : ""}
          </div>
          {g.itens.map((l, idx) => (
            <label key={l.id} className="flex items-center gap-3 py-1.5" style={{ borderTop: idx ? "1px solid var(--linha)" : "0" }}>
              <input type="checkbox" checked={!!marcados[l.id]}
                     onChange={(e) => { const v = e.target.checked; setMarcados(m => Object.assign({}, m, { [l.id]: v })); }} />
              <span className="flex-1 text-[13px]">
                <span className="font-semibold">{l.estabelecimento || l.descricao || "(sem nome)"}</span>
                <span style={{ color: "var(--suave)" }}> · {dataCurta(l.data)} · {l.origem || "manual"}
                  {idx === 0 ? " · fica (mais completo)" : ""}</span>
              </span>
              <span className="text-[13px] font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{currency(l.valor)}</span>
            </label>
          ))}
        </Cartao>
      ))}
      <Botao tom="perigo" disabled={!total}
             onClick={() => onRemover(Object.keys(marcados).filter(k => marcados[k]))}>
        <IconTrash size={15} /> Apagar {total} marcado(s)
      </Botao>
    </div>
  );
}
