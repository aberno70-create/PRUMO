  .grade-totais { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; }
  .grade-form  { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .grade-form-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .grade-cad   { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) {
    .grade-totais { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .grade-form   { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grade-form-2 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grade-cad    { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  /* ---------------------------------------------------------------
     CELULAR: tabelas largas viram fichas empilhadas. Cada celula
     ocupa uma linha, com o nome da coluna a esquerda e o valor a
     direita, para nada mais sair da tela.
  --------------------------------------------------------------- */
  @media (max-width: 640px) {
    table.tab-resp { min-width: 0 !important; width: 100% !important; }
    table.tab-resp thead { display: none; }
    table.tab-resp, table.tab-resp tbody, table.tab-resp tr, table.tab-resp td { display: block; width: 100%; }
    table.tab-resp tr { border-top: 1px solid var(--linha) !important; padding: 6px 0; }
    table.tab-resp td {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      text-align: right !important; border: 0 !important; padding: 2px 10px !important;
      white-space: normal !important; word-break: break-word;
    }
    table.tab-resp td::before {
      content: attr(data-rot); color: var(--suave); font-size: 10px; letter-spacing: .04em;

  --------------------------------------------------------------- */

const dataHojeISO = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};
const mesDaData = (iso) => String(iso || "").slice(0, 7);
const mesHoje = () => dataHojeISO().slice(0, 7);

function mesSomado(mesISO, delta) {
  const [a, m] = String(mesISO).split("-").map(Number);
  const d = new Date(a, (m - 1) + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
const MESES_PT_ACENTO = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function mesPorExtenso(mesISO) {
  const [a, m] = String(mesISO).split("-").map(Number);
  if (!a || !m) return mesISO;
  return MESES_PT_ACENTO[m - 1] + " de " + a;
}
function dataCurta(iso) {
  const p = String(iso || "").split("-");
  return p.length === 3 ? p[2] + "/" + p[1] : (iso || "");
}

/* Numero digitado no celular: aceita "1.234,56", "1234.56" e "1234,56". */
function paraNumero(txt) {
  if (typeof txt === "number") return txt;
  let s = String(txt == null ? "" : txt).trim().replace(/[R$\s]/g, "");
  if (!s) return 0;
  if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

/* Texto normalizado para comparar estabelecimento: sem acento, sem
   pontuacao, sem palavra de maquininha. E a base da conciliacao. */
const LIXO_ESTABELECIMENTO = /\b(ltda|me|epp|sa|s\/a|eireli|comercio|com|ind|industria|mercado pago|mercadopago|pagseguro|pag|cielo|rede|getnet|stone|sumup|pix|ted|doc|debito|credito|compra|cartao|parc|parcela|\d{2}\/\d{2})\b/g;
function normalizarTexto(txt) {
  return String(txt || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(LIXO_ESTABELECIMENTO, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* Codigo curto e SEM ACENTO para virar nome de pasta no Dropbox
   (Dropbox-API-Arg e cabecalho HTTP: so ASCII) e etiqueta na tela. */
function paraCodigo(txt) {
  return String(txt || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 24);
}

async function sha256Hex(texto) {
  const enc = new TextEncoder().encode(texto);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function lsGet(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }

}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }

/* ===========================================================
   DROPBOX — OAuth2 com PKCE, escopo "App folder".
   Funciona em qualquer navegador, inclusive no celular. Nao ha
   client secret no fluxo PKCE, entao a App Key pode ficar a
   vista sem expor nada.
   O Dropbox NAO EXECUTA NADA aqui: e so armazenamento.
=========================================================== */
const LS_DROPBOX = {
  appKey:       "prumo_dropbox_app_key",
  accessToken:  "prumo_dropbox_access_token",
  refreshToken: "prumo_dropbox_refresh_token",
  expiraEm:     "prumo_dropbox_expira_em",
  verifier:     "prumo_dropbox_pkce_verifier" // so durante o login, apagado depois
};

const NOME_ARQUIVO_DROPBOX = "/prumo-dados.json";
const PASTA_ENTRADA_DBX  = "/ENTRADA";
const PASTA_LANCADOS_DBX = "/LANCADOS";

/* App Key do app "Prumo" no Dropbox. E publica por natureza: no fluxo
   PKCE nao existe client secret no navegador, entao deixar fixa aqui
   nao expoe nada — so evita ter que digitar de novo a cada versao,
   inclusive no celular, onde cada versao nova ganha localStorage
   proprio. A chave da Anthropic, essa sim, nunca entra no codigo. */
const DROPBOX_APP_KEY_PADRAO = "z7n9irhjhs7n1b0";
try {
  if (DROPBOX_APP_KEY_PADRAO && !localStorage.getItem(LS_DROPBOX.appKey)) {
    localStorage.setItem(LS_DROPBOX.appKey, DROPBOX_APP_KEY_PADRAO);
  }
} catch (e) { /* navegador sem localStorage: segue sem travar */ }

function dropboxAppKeyAtual() {
  try { return localStorage.getItem(LS_DROPBOX.appKey) || DROPBOX_APP_KEY_PADRAO || ""; }
  catch (e) { return DROPBOX_APP_KEY_PADRAO || ""; }
}

function dropboxGerarVerifier() {
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
}
async function dropboxDesafioPKCE(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(hash))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
}

/* SEMPRE a pasta do app, nunca o arquivo. O endereco de retorno tem
   que bater EXATAMENTE com o cadastrado no app do Dropbox. Quando o
   app roda em .../PRUMO/app.html, devolver o caminho com "app.html"
   no fim faz o Dropbox recusar a autorizacao. O carregador
   (index.html) repassa o ?code=... para o app.html. */
function dropboxRedirectUri() {
  const pasta = window.location.pathname.replace(/[^\/]*$/, "");
  return window.location.origin + pasta;
}

async function dropboxIniciarLogin(appKey) {
  const verifier = dropboxGerarVerifier();
  localStorage.setItem(LS_DROPBOX.verifier, verifier);
  localStorage.setItem(LS_DROPBOX.appKey, appKey);
  const challenge = await dropboxDesafioPKCE(verifier);
  const params = new URLSearchParams({
    client_id: appKey,
    response_type: "code",
    code_challenge: challenge,
    code_challenge_method: "S256",
    token_access_type: "offline",
    redirect_uri: dropboxRedirectUri()
  });
  window.location.href = "https://www.dropbox.com/oauth2/authorize?" + params.toString();
}

async function dropboxTrocarCodigoPorToken(code) {
  const appKey = dropboxAppKeyAtual();
  const verifier = localStorage.getItem(LS_DROPBOX.verifier);
  if (!appKey || !verifier) return false;
  const params = new URLSearchParams({
    code: code, grant_type: "authorization_code", client_id: appKey,
    code_verifier: verifier, redirect_uri: dropboxRedirectUri()
  });
  const resp = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString()
  });
  if (!resp.ok) return false;
  const dados = await resp.json();
  localStorage.setItem(LS_DROPBOX.accessToken, dados.access_token);
  if (dados.refresh_token) localStorage.setItem(LS_DROPBOX.refreshToken, dados.refresh_token);
  localStorage.setItem(LS_DROPBOX.expiraEm, String(Date.now() + (dados.expires_in - 60) * 1000));
  localStorage.removeItem(LS_DROPBOX.verifier);
  return true;
}

async function dropboxRenovarToken() {
  const appKey = dropboxAppKeyAtual();
  const refreshToken = localStorage.getItem(LS_DROPBOX.refreshToken);
  if (!appKey || !refreshToken) return false;
  const params = new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: appKey });
  const resp = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params.toString()
  });
  if (!resp.ok) return false;
  const dados = await resp.json();
  localStorage.setItem(LS_DROPBOX.accessToken, dados.access_token);
  localStorage.setItem(LS_DROPBOX.expiraEm, String(Date.now() + (dados.expires_in - 60) * 1000));
  return true;
}

async function dropboxTokenValido() {
  const expiraEm = Number(localStorage.getItem(LS_DROPBOX.expiraEm) || 0);
  if (Date.now() < expiraEm) return localStorage.getItem(LS_DROPBOX.accessToken);
  const ok = await dropboxRenovarToken();
  return ok ? localStorage.getItem(LS_DROPBOX.accessToken) : null;
}
function dropboxEstaConectado() {
  try { return !!localStorage.getItem(LS_DROPBOX.refreshToken); } catch (e) { return false; }
}
function dropboxDesconectar() {
  Object.keys(LS_DROPBOX).forEach((k) => {
    if (k !== "appKey") localStorage.removeItem(LS_DROPBOX[k]);
  });
}

/* O cabecalho Dropbox-API-Arg viaja como cabecalho HTTP, e cabecalho
   HTTP so aceita ASCII. Um arquivo com "cartao de credito" acentuado
   quebra a requisicao inteira e o documento parece corrompido. A
   propria Dropbox manda escapar tudo acima de 0x7F em \uXXXX. */
function dropboxArg(obj) {
  return JSON.stringify(obj).replace(/[\u007f-\uffff]/g, function (ch) {
    return "\\u" + ("000" + ch.charCodeAt(0).toString(16)).slice(-4);
  });
}

async function dropboxLerDados() {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://content.dropboxapi.com/2/files/download", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Dropbox-API-Arg": dropboxArg({ path: NOME_ARQUIVO_DROPBOX }) }
  });
  if (resp.status === 409) return null; // ainda nao existe: normal na primeira conexao
  if (!resp.ok) throw new Error("FALHA_LEITURA");
  const texto = await resp.text();
  return texto ? JSON.parse(texto) : null;
}

async function dropboxEscreverDados(dados) {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://content.dropboxapi.com/2/files/upload", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + token,
      "Dropbox-API-Arg": dropboxArg({ path: NOME_ARQUIVO_DROPBOX, mode: "overwrite", mute: true }),
      "Content-Type": "application/octet-stream"
    },
    body: JSON.stringify(dados)
  });
  if (!resp.ok) throw new Error("FALHA_ESCRITA");
}

async function dropboxRpc(endpoint, corpo) {
  const token = await dropboxTokenValido();
  if (!token) throw new Error("SEM_TOKEN");
  const resp = await fetch("https://api.dropboxapi.com/2/" + endpoint, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(corpo)
  });
  if (resp.status === 401 || resp.status === 403) {
    const t = await resp.text();
    if (/scope/i.test(t)) throw new Error("SEM_PERMISSAO_LISTAR");
    throw new Error("SEM_TOKEN");
  }
  if (!resp.ok) {
    const t = await resp.text();
    if (/not_found/.test(t)) return null;
    throw new Error("FALHA_DROPBOX: " + t.slice(0, 120));
  }
  return resp.json();
}

/* Cria a caixa de entrada e uma pasta por conta cadastrada.
   O nome da pasta e o CODIGO da conta (PF-ITAU, PJ-BB...), sempre
   ASCII, porque Dropbox-API-Arg e cabecalho HTTP.
   Voce joga o arquivo na pasta do banco e o app ja sabe de quem e;
   se jogar na /ENTRADA solta, o app descobre pelo conteudo. */
async function dropboxGarantirPastas(codigos) {
  const alvos = [PASTA_ENTRADA_DBX, PASTA_LANCADOS_DBX];
  (codigos || []).forEach(c => { if (c) alvos.push(PASTA_ENTRADA_DBX + "/" + c); });
  for (const p of alvos) {
    try { await dropboxRpc("files/create_folder_v2", { path: p, autorename: false }); }
    catch (e) { /* ja existe: tudo bem */ }
  }
  return alvos;
}

/* Aceita qualquer arquivo antigo ou incompleto sem quebrar. */
function normalizarEnvelope(bruto) {
  const base = envelopeVazio();
  if (!bruto || typeof bruto !== "object") return base;
  const arr = (x) => (Array.isArray(x) ? x : []);
  // Conta e cartao de arquivo antigo entram como PF, que era o unico caso.
  const contas = arr(bruto.contas).map(c => Object.assign({ titularidade: "PF" }, c,
    { codigo: c.codigo || paraCodigo((c.titularidade || "PF") + "-" + (c.banco || c.nome || "CONTA")) }));
  /* O cartao tambem ganha codigo: ele tem pasta propria no Dropbox,
     porque as faturas sao varias e chegam separadas por cartao. */
  const cartoes = arr(bruto.cartoes).map(c => Object.assign({ titularidade: "PF" }, c,
    { codigo: c.codigo || paraCodigo((c.titularidade || "PF") + "-" + (c.banco || "") + "-CARTAO-" + (c.nome || "")) }));
  return {
    versao: 2,
    lancamentos: arr(bruto.lancamentos),
    contas: contas,
    cartoes: cartoes,
    /* Contrato sem tabela de parcelas (importado, ou vindo de um
       arquivo antigo) tem a tabela montada na hora — senao ele
       apareceria como "quitado, faltam 0". */
    contratos: arr(bruto.contratos).map(c => (c.parcelas && c.parcelas.length)
      ? c
      : Object.assign({}, c, { parcelas: gerarParcelas(c, []).parcelas })),
    aplicacoes: arr(bruto.aplicacoes),

       nome — ninguem precisa sair escolhendo icone de 18 categorias. */
    categorias: (arr(bruto.categorias).length ? arr(bruto.categorias) : base.categorias)
      .map(c => c.icone ? c : Object.assign({}, c, { icone: adivinharIcone(c.nome, c.tipo) })),
    recorrentes: arr(bruto.recorrentes),
    config: Object.assign({}, base.config, bruto.config || {}),
    salvoEm: bruto.salvoEm || null
  };
}

/* ===========================================================
   DUPLICIDADE — o erro mais caro do app de fretes (R$ 11.500
   lancados duas vezes). Aqui o risco e maior ainda: a mesma
   compra chega pela foto do comprovante E pela linha do extrato.
   Tres camadas, todas obrigatorias desde a v1:
   1) o botao de lancar so liga quando o dataset ja chegou;
   2) segunda checagem no ato de lancar, contra o estado atual;
   3) regra de negocio forte, alem do hash do arquivo.
=========================================================== */

/* Chave de negocio: tipo + data + valor + estabelecimento normalizado. */
function chaveNegocio(l) {
  return [
    l.tipo || "despesa",
    l.data || "",
    (Number(l.valor) || 0).toFixed(2),
    normalizarTexto(l.estabelecimento || l.descricao || "")
  ].join("|");
}

function diasEntre(a, b) {
  const da = new Date(a + "T12:00:00"), db = new Date(b + "T12:00:00");
  if (isNaN(da) || isNaN(db)) return 999;
  return Math.round(Math.abs(da - db) / 86400000);
}

/* Candidatos a duplicata de UM lancamento novo contra a lista atual.
   Regra do briefing: data +-3 dias, valor exato, estabelecimento
   normalizado igual ou contido. Nunca decide sozinho — devolve para
   o app pedir confirmacao. */
function procurarPossivelDuplicado(lista, novo) {
  const valorNovo = (Number(novo.valor) || 0).toFixed(2);
  const estNovo = normalizarTexto(novo.estabelecimento || novo.descricao || "");
  const achados = [];
  for (const l of lista) {
    if (l.id && novo.id && l.id === novo.id) continue;
    if ((Number(l.valor) || 0).toFixed(2) !== valorNovo) continue;
    if ((l.tipo || "despesa") !== (novo.tipo || "despesa")) continue;
    const dist = diasEntre(l.data, novo.data);
    if (dist > 3) continue;

    // identificador unico do banco (OFX): casamento certo, sem duvida
    const fitidIgual = !!(l.origemRef && novo.origemRef && l.origemRef.fitid &&
                          l.origemRef.fitid === novo.origemRef.fitid);
    const hashIgual = !!(l.origemRef && novo.origemRef && l.origemRef.hash &&
                         l.origemRef.hash === novo.origemRef.hash);

    const estL = normalizarTexto(l.estabelecimento || l.descricao || "");
    const textoBate = !!estNovo && !!estL &&
      (estL === estNovo || estL.indexOf(estNovo) >= 0 || estNovo.indexOf(estL) >= 0);

    let forca = 0;
    if (fitidIgual || hashIgual) forca = 3;                 // certeza
    else if (textoBate && dist === 0) forca = 2;            // muito provavel
    else if (textoBate) forca = 1;                          // provavel
    else if (dist === 0 && (l.origem || "") !== (novo.origem || "")) forca = 1; // foto x extrato
    if (forca > 0) achados.push({ lancamento: l, forca: forca, dias: dist });
  }
  return achados.sort((a, b) => b.forca - a.forca);
}

/* Qual registro fica, quando dois sao a mesma coisa: o mais completo. */
function pontuacaoParaFicar(l, categorias) {
  let p = 0;
  if (l.categoria) p += 3;
  if (l.contaId || l.cartaoId) p += 2;
  if (l.estabelecimento) p += 2;
  if (l.descricao) p += 1;
  if (l.origemRef && l.origemRef.fitid) p += 3;   // veio do OFX: dado do banco
  if (l.origemRef && l.origemRef.arquivo) p += 2; // tem documento junto
  if (l.origem === "extrato" || l.origem === "fatura") p += 1;
  return p;
}

/* Varredura completa da base, para a tela "Procurar duplicados". */
function acharDuplicados(lancamentos, categorias) {
  const catPorId = {};
  (categorias || []).forEach(c => { catPorId[c.id] = c; });
  const grupos = [];
  const jaAgrupado = {};

  for (let i = 0; i < lancamentos.length; i++) {
    const a = lancamentos[i];
    if (jaAgrupado[a.id]) continue;
    const iguais = [a];
    let forcaMax = 0;
    for (let j = i + 1; j < lancamentos.length; j++) {
      const b = lancamentos[j];
      if (jaAgrupado[b.id]) continue;
      const achados = procurarPossivelDuplicado([b], a);
      if (achados.length) {
        iguais.push(b);
        jaAgrupado[b.id] = true;
        forcaMax = Math.max(forcaMax, achados[0].forca);
      }
    }
    if (iguais.length > 1) {
      jaAgrupado[a.id] = true;
      const ordenados = iguais.slice().sort((x, y) => {
        const d = pontuacaoParaFicar(y, categorias) - pontuacaoParaFicar(x, categorias);
        return d !== 0 ? d : String(x.criadoEm || "").localeCompare(String(y.criadoEm || ""));
      });
      // Item que repete por natureza (mercado, combustivel, refeicao) NUNCA
      // vem pre-marcado: duas compras iguais no mesmo dia acontecem de verdade.
      const cat = catPorId[ordenados[0].categoria];
      const repetitiva = !!(cat && cat.repetitiva);
      const preMarcar = forcaMax >= 3 || (forcaMax >= 2 && !repetitiva);
      grupos.push({
        id: "g-" + ordenados[0].id,
        itens: ordenados,
        fica: ordenados[0].id,
        forca: forcaMax,
        repetitiva: repetitiva,
        preMarcar: preMarcar
      });
    }
  }
  return grupos;
}

/* ===========================================================
   O ESTADO DO APP — carga, trava e gravacao
=========================================================== */
function useDados() {
  const [dados, setDados] = useState(() => normalizarEnvelope(lsGet(LS_KEYS.dados)));
  // dadosProntos = false trava TODO lancamento. Sem isso, a checagem
  // de duplicidade compara contra lista vazia e duplica tudo.
  const [dadosProntos, setDadosProntos] = useState(false);
  const [statusCarga, setStatusCarga] = useState("iniciando");
  const [statusSalvar, setStatusSalvar] = useState("");
  const [erroCarga, setErroCarga] = useState("");
  const timerRef = useRef(null);
  const dadosRef = useRef(dados);
  useEffect(() => { dadosRef.current = dados; }, [dados]);

  const carregar = useCallback(async () => {
    setErroCarga("");
    if (!dropboxEstaConectado()) {
      // Sem nuvem, o arquivo local E a fonte: nada a esperar.
      setStatusCarga("local");
      setDadosProntos(true);
      return;
    }
    setStatusCarga("carregando");
    setDadosProntos(false);
    try {
      const remoto = await dropboxLerDados();
      if (remoto) {
        const env = normalizarEnvelope(remoto);
        setDados(env);
        lsSet(LS_KEYS.dados, env);
      }
      setStatusCarga("nuvem");
      setDadosProntos(true);
    } catch (e) {
      setStatusCarga("erro");
      setErroCarga(traduzirErro(e));
      setDadosProntos(false); // trava de proposito: nao lanca as cegas
    }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const gravarNuvem = useCallback(async (env) => {
    if (!dropboxEstaConectado()) { setStatusSalvar("local"); return; }
    setStatusSalvar("salvando");
    try {
      await dropboxEscreverDados(env);
      setStatusSalvar("salvo");
    } catch (e) {
      setStatusSalvar("erro");
    }
  }, []);

  // Toda alteracao passa por aqui: grava local na hora e agenda a nuvem.
  const alterar = useCallback((fn) => {
    setDados((atual) => {
      const bruto = typeof fn === "function" ? fn(atual) : fn;
      const env = Object.assign({}, bruto, { salvoEm: new Date().toISOString() });
      lsSet(LS_KEYS.dados, env);
      if (timerRef.current) clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => { gravarNuvem(env); }, 1200);
      return env;
    });
  }, [gravarNuvem]);

  const salvarAgora = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    return gravarNuvem(dadosRef.current);
  }, [gravarNuvem]);

  return { dados, alterar, dadosProntos, statusCarga, statusSalvar, erroCarga, recarregar: carregar, salvarAgora };
}

/* Erros da API e do Dropbox em portugues de gente. */
function traduzirErro(e) {
  const m = String((e && e.message) || e || "");
  if (/SEM_TOKEN/.test(m)) return "A conexão com o Dropbox expirou. Conecte de novo nas Configurações.";
  if (/SEM_PERMISSAO_LISTAR/.test(m)) return "O app do Dropbox está sem a permissão de ler a pasta. Marque files.content.read e files.content.write e conecte de novo.";
  if (/SEM_CHAVE_API/.test(m)) return "Falta a chave da API da Anthropic nas Configurações.";
  if (/FALHA_LEITURA/.test(m)) return "Não consegui ler o arquivo no Dropbox.";
  if (/FALHA_ESCRITA/.test(m)) return "Não consegui gravar no Dropbox.";
  if (/FORMATO_HEIC/.test(m)) return "Foto em HEIC do iPhone. Mude a câmera para “Mais compatível” ou mande em JPEG.";
  if (/FORMATO_NAO_SUPORTADO/.test(m)) return "Formato de arquivo não aceito. Use JPEG, PNG, WEBP ou PDF.";
  if (/ERRO_API: 401/.test(m)) return "A chave da API foi recusada (401). Confira a chave nas Configurações.";
  if (/ERRO_API: 429/.test(m)) return "A API está com limite de uso atingido (429). Espere um pouco e tente de novo.";
  if (/ERRO_API: 5/.test(m)) return "A API da Anthropic está fora do ar no momento. Tente daqui a pouco.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem internet ou conexão bloqueada.";
  return m || "Erro desconhecido.";
}


/* ===========================================================
   BANCO A BANCO — saldo, extrato com saldo em cada linha,
   e a conferencia que descobre extrato parcial.
=========================================================== */

/* De quem e o lancamento: sai da conta ou do cartao, nunca de
   uma marcacao a mao — assim o sintetico PF/PJ nunca desencontra. */
function titularidadeDoLancamento(l, mapaContas, mapaCartoes) {
  if (l.cartaoId && mapaCartoes[l.cartaoId]) return mapaCartoes[l.cartaoId].titularidade || "PF";
  if (l.contaId && mapaContas[l.contaId]) return mapaContas[l.contaId].titularidade || "PF";
  return l.titularidade || "PF";
}

function indexarPorId(lista) {
  const m = {}; (lista || []).forEach(x => { m[x.id] = x; }); return m;
}

/* Efeito do lancamento no dinheiro DA CONTA.
   Compra no cartao nao mexe na conta — quem mexe e o pagamento da
   fatura. Por isso so entra o que tem contaId. */
function efeitoNaConta(l) {
  if (!l.contaId) return 0;
  return (l.tipo === "receita" ? 1 : -1) * (Number(l.valor) || 0);
}

/* Extrato da conta com o saldo acumulado em CADA LINHA, partindo do
   saldo inicial informado no cadastro (ou do saldo do primeiro
   extrato importado). */
function extratoDaConta(conta, lancamentos, ateData) {
  const doBanco = (lancamentos || [])
    .filter(l => l.contaId === conta.id)
    .filter(l => !ateData || String(l.data) <= ateData)
    .sort((a, b) => String(a.data).localeCompare(String(b.data)) ||
                    (Number(a.ordem || 0) - Number(b.ordem || 0)) ||
                    String(a.criadoEm || "").localeCompare(String(b.criadoEm || "")));
  let saldo = Number(conta.saldoInicial) || 0;
  return doBanco.map(l => {
    saldo += efeitoNaConta(l);
    return Object.assign({}, l, { saldo: saldo });
  });
}

function saldoDaConta(conta, lancamentos, ateData) {
  const linhas = extratoDaConta(conta, lancamentos, ateData);
  return linhas.length ? linhas[linhas.length - 1].saldo : (Number(conta.saldoInicial) || 0);
}

/* ===========================================================
   COBERTURA DE EXTRATO — o que responde "esse extrato e parcial?"
   Cada importacao grava o periodo, o saldo inicial e o saldo final
   que o proprio banco declara. Duas conferencias saem daqui:
   1) FURO: falta pedaco entre um extrato e o seguinte;
   2) INCOMPLETO: o saldo final declarado nao bate com o saldo
      inicial mais a soma das linhas — entao vieram linhas de menos.
=========================================================== */
function diaSeguinte(iso) {
  const d = new Date(String(iso) + "T12:00:00");
  if (isNaN(d)) return iso;
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

function conferirCobertura(cob) {
  const ini = Number(cob.saldoIni) || 0;
  const fim = Number(cob.saldoFim);
  const somaLinhas = Number(cob.somaLinhas) || 0;
  if (cob.saldoFim == null || isNaN(fim)) {
    return { completo: null, diferenca: 0, texto: "o extrato não declara o saldo final — não dá para conferir" };
  }
  const diferenca = Math.round((ini + somaLinhas - fim) * 100) / 100;
  if (Math.abs(diferenca) < 0.005) return { completo: true, diferenca: 0, texto: "confere: saldo inicial + lançamentos = saldo final" };
  return {
    completo: false, diferenca: diferenca,
    texto: "faltam lançamentos: sobra " + currency(Math.abs(diferenca)) + " de diferença entre o que veio e o saldo final do banco"
  };
}

/* Furos entre os extratos ja importados de uma conta. */
function furosDaConta(contaId, coberturas) {
  const lista = (coberturas || [])
    .filter(c => c.contaId === contaId && c.ini && c.fim)
    .sort((a, b) => String(a.ini).localeCompare(String(b.ini)));
  const furos = [];
  for (let i = 1; i < lista.length; i++) {
    const fimAnterior = lista[i - 1].fim;
    const iniAtual = lista[i].ini;
    if (diaSeguinte(fimAnterior) < iniAtual) {
      furos.push({ de: diaSeguinte(fimAnterior), ate: String(new Date(new Date(iniAtual + "T12:00:00").getTime() - 86400000).toISOString().slice(0, 10)) });
    }
    // saldo final de um tem que ser o saldo inicial do proximo
    const sf = lista[i - 1].saldoFim, si = lista[i].saldoIni;
    if (sf != null && si != null && Math.abs(Number(sf) - Number(si)) > 0.005 && diaSeguinte(fimAnterior) === iniAtual) {
      furos.push({ de: fimAnterior, ate: iniAtual, saldoPula: Math.round((Number(si) - Number(sf)) * 100) / 100 });
    }
  }
  return furos;
}

function coberturaDaConta(contaId, coberturas) {
  const lista = (coberturas || []).filter(c => c.contaId === contaId).sort((a, b) => String(a.ini).localeCompare(String(b.ini)));
  if (!lista.length) return null;
  return { de: lista[0].ini, ate: lista[lista.length - 1].fim, quantos: lista.length };
}

/* ===========================================================
   CONTRATOS — financiamento, emprestimo, consorcio.
   Tabela Price gerada a partir de valor, prazo e taxa. Quando a
   taxa nao vem no contrato, ela e descoberta pela parcela.
=========================================================== */
function parcelaPrice(valor, taxaMes, n) {
  const i = (Number(taxaMes) || 0) / 100;
  if (!n) return 0;
  if (i <= 0) return valor / n;
  return valor * i / (1 - Math.pow(1 + i, -n));
}

/* Acha a taxa mensal a partir da parcela, por bisseccao — serve
   quando o contrato so informa valor, prazo e prestacao. */
function taxaPelaParcela(valor, parcela, n) {
  if (!valor || !parcela || !n) return 0;
  if (parcela * n <= valor) return 0;
  let lo = 0, hi = 20; // 0% a 20% ao mes
  for (let k = 0; k < 200; k++) {
    const mid = (lo + hi) / 2;
    if (parcelaPrice(valor, mid, n) > parcela) hi = mid; else lo = mid;
  }
  return Math.round(((lo + hi) / 2) * 10000) / 10000;
}

function somarMeses(iso, meses, dia) {
  const [a, m, d] = String(iso).split("-").map(Number);
  const base = new Date(a, (m - 1) + meses, 1);
  const diaAlvo = dia || d || 1;
  const ultimo = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  base.setDate(Math.min(diaAlvo, ultimo));
  return base.getFullYear() + "-" + String(base.getMonth() + 1).padStart(2, "0") + "-" + String(base.getDate()).padStart(2, "0");
}

/* Gera as parcelas preservando o que ja foi baixado. */
function gerarParcelas(contrato, parcelasAtuais) {
  const n = Number(contrato.prazoMeses) || 0;
  const valor = Number(contrato.valorFinanciado) || 0;
  let taxa = Number(contrato.taxaMes) || 0;
  const parcelaInformada = Number(contrato.valorParcela) || 0;
  if (!taxa && parcelaInformada) taxa = taxaPelaParcela(valor, parcelaInformada, n);
  const p = parcelaInformada || parcelaPrice(valor, taxa, n);
  const i = taxa / 100;
  const antigas = {};
  (parcelasAtuais || []).forEach(x => { antigas[x.n] = x; });

  let saldo = valor;
  const out = [];
  for (let k = 1; k <= n; k++) {
    const juros = Math.round(saldo * i * 100) / 100;
    let amort = Math.round((p - juros) * 100) / 100;
    if (k === n) amort = Math.round(saldo * 100) / 100;
    saldo = Math.round((saldo - amort) * 100) / 100;
    const velha = antigas[k] || {};
    out.push({
      n: k,
      vencimento: somarMeses(contrato.dataInicio || dataHojeISO(), k, Number(contrato.diaVencimento) || 0),
      valor: Math.round((k === n ? amort + juros : p) * 100) / 100,
      juros: juros,
      amortizacao: amort,
      saldoDevedor: Math.max(0, saldo),
      pago: !!velha.pago,
      dataPagamento: velha.dataPagamento || "",
      valorPago: velha.valorPago || 0,
      lancamentoId: velha.lancamentoId || ""
    });
  }
  return { parcelas: out, taxaUsada: taxa, parcelaUsada: p };
}

function resumoContrato(contrato) {
  const ps = contrato.parcelas || [];
  const pagas = ps.filter(x => x.pago);
  const abertas = ps.filter(x => !x.pago);
  const hoje = dataHojeISO();
  const vencidas = abertas.filter(x => x.vencimento < hoje);
  const proxima = abertas.slice().sort((a, b) => String(a.vencimento).localeCompare(String(b.vencimento)))[0] || null;
  const totalPago = pagas.reduce((s, x) => s + (Number(x.valorPago) || Number(x.valor) || 0), 0);
  const totalContrato = ps.reduce((s, x) => s + (Number(x.valor) || 0), 0);
  const saldoDevedor = proxima ? (Number(proxima.saldoDevedor) || 0) + (Number(proxima.amortizacao) || 0)
                               : (ps.length ? 0 : Number(contrato.valorFinanciado) || 0);
  const taxaMes = Number(contrato.taxaMes) || 0;
  return {
    total: ps.length,
    pagas: pagas.length,
    faltam: abertas.length,
    vencidas: vencidas.length,
    totalPago: totalPago,
    totalContrato: totalContrato,
    aPagar: totalContrato - totalPago,
    saldoDevedor: saldoDevedor,
    proxima: proxima,
    inicio: ps.length ? ps[0].vencimento : (contrato.dataInicio || ""),
    fim: ps.length ? ps[ps.length - 1].vencimento : "",
    taxaMes: taxaMes,
    taxaAno: taxaMes ? Math.round((Math.pow(1 + taxaMes / 100, 12) - 1) * 10000) / 100 : 0
  };
}

/* ===========================================================
   APLICACOES — o saldo entra por print da tela do banco; aqui
   fica so o historico, para dar a variacao.
=========================================================== */
function saldoAplicacao(ap) {
  const h = (ap.historico || []).slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
  return h.length ? Number(h[0].valor) || 0 : 0;
}
function dataSaldoAplicacao(ap) {
  const h = (ap.historico || []).slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
  return h.length ? h[0].data : "";
}
function variacaoAplicacao(ap) {
  const h = (ap.historico || []).slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
  if (h.length < 2) return null;
  const atual = Number(h[0].valor) || 0, antes = Number(h[1].valor) || 0;
  return { valor: atual - antes, pct: antes ? ((atual - antes) / antes) * 100 : null, de: h[1].data };
}

/* ===========================================================
   CARTAO DE CREDITO — a fatura nao e o mes do calendario.
   Uma compra do dia 29, num cartao que fecha dia 28, cai na
   fatura do mes seguinte. Quem manda e o ciclo de fechamento.
=========================================================== */
function diaValidoNoMes(ano, mes, dia) {
  const ultimo = new Date(ano, mes, 0).getDate();
  return ano + "-" + String(mes).padStart(2, "0") + "-" + String(Math.min(dia || 1, ultimo)).padStart(2, "0");
}
function mesMenos(ano, mes, n) {
  const d = new Date(ano, (mes - 1) - n, 1);
  return { ano: d.getFullYear(), mes: d.getMonth() + 1 };
}

/* Ciclo da fatura que VENCE no mes de referencia. */
function cicloFatura(cartao, mesRef) {
  const [a, m] = String(mesRef).split("-").map(Number);
  const V = Number(cartao.diaVencimento) || 10;
  const F = Number(cartao.diaFechamento) || 1;
  const vencimento = diaValidoNoMes(a, m, V);
  // fecha no mesmo mes do vencimento se o fechamento vem antes; senao, no mes anterior
  const mf = (F < V) ? { ano: a, mes: m } : mesMenos(a, m, 1);
  const fechamento = diaValidoNoMes(mf.ano, mf.mes, F);
  const ma = mesMenos(mf.ano, mf.mes, 1);
  const fechamentoAnterior = diaValidoNoMes(ma.ano, ma.mes, F);
  return { inicio: diaSeguinte(fechamentoAnterior), fim: fechamento, vencimento: vencimento };
}

function faturaDoCartao(cartao, lancamentos, mesRef) {
  const c = cicloFatura(cartao, mesRef);
  const compras = (lancamentos || [])
    .filter(l => l.cartaoId === cartao.id)
    .filter(l => String(l.data) >= c.inicio && String(l.data) <= c.fim)
    .sort((x, y) => String(x.data).localeCompare(String(y.data)));
  const total = compras.reduce((s, l) => s + (l.tipo === "receita" ? -1 : 1) * (Number(l.valor) || 0), 0);
  return { inicio: c.inicio, fim: c.fim, vencimento: c.vencimento, compras: compras, total: total };
}

/* A fatura ABERTA — a que esta recebendo compras hoje. Quase nunca e
   a que vence no mes corrente: um cartao que fecha dia 28 esta, no dia
   31, juntando compras para a fatura de dois meses adiante. Abrir a
   tela na fatura errada faz o app parecer que perdeu lancamento. */
function mesFaturaAberta(cartao) {
  const hoje = dataHojeISO();
  let mm = mesHoje();
  for (let i = 0; i < 4; i++) {
    if (hoje <= cicloFatura(cartao, mm).fim) return mm;
    mm = mesSomado(mm, 1);
  }
  return mm;
}

/* Soma das faturas ABERTAS de todos os cartoes: e o "quanto ja devo
   no cartao" que interessa no dia a dia. */
function totalFaturasAbertas(cartoes, lancamentos) {
  return (cartoes || []).reduce((s, k) => s + faturaDoCartao(k, lancamentos, mesFaturaAberta(k)).total, 0);
}
